<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MCP · 连接与调用演示</title>
  <style>:root { --blue:#003f98; --ink:#002060; --red:#c00000; --aux:#0070c0; --slide-scale:1; }
* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; }
body { background:#e7e9ed; color:var(--ink); font-family:"Microsoft YaHei","微软雅黑",Arial,"PingFang SC",sans-serif; }
button,input,select { font:inherit; }
button,a,input,select,summary { -webkit-tap-highlight-color:transparent; }
button { cursor:pointer; }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:3px solid var(--aux); outline-offset:4px; }
#viewport { position:fixed; inset:0; display:grid; place-items:center; overflow:hidden; }
#slide-mount { position:absolute; left:50%; top:50%; width:1600px; height:900px; transform:translate(-50%,-50%) scale(var(--slide-scale)); transform-origin:center; }
.slide { width:1600px; height:900px; background:#fff; overflow:hidden; position:relative; color:var(--ink); font-size:34px; line-height:1.42; font-weight:650; }
.slide-header { height:112px; position:relative; padding:17px 34px 15px; display:flex; align-items:center; }
.slide-title { position:relative; z-index:1; font-size:56px; line-height:1.12; font-weight:800; color:var(--blue); margin:0; max-width:1240px; letter-spacing:0; }
.slide-logo { display:block; position:absolute; left:0; top:16px; width:1600px; height:auto; object-fit:contain; pointer-events:none; }
.slide-content { position:absolute; left:0; top:112px; width:100%; height:788px; padding:34px 44px 38px; display:flex; flex-direction:column; gap:26px; }
.slide-body { flex:0 0 auto; min-width:0; }
.slide-body:empty { display:none; }
.slide-content:not(.has-frames):not(.has-widget) .slide-body { flex:1 1 auto; }
.frame-stage { flex:1 1 auto; min-height:0; min-width:0; }
.frame-label { font-size:26px; color:var(--blue); margin-bottom:14px; font-weight:700; }
.frame-content { min-width:0; }
.frame-enter { animation:frame-in 160ms ease-out; }
@keyframes frame-in { from { opacity:.5; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
.widget-stage { min-height:0; min-width:0; flex:1 1 auto; }
.slide p { margin:0 0 24px; }
.slide h2 { font-size:40px; line-height:1.25; margin:0 0 22px; font-weight:800; }
.slide h3 { font-size:34px; line-height:1.3; margin:0 0 18px; font-weight:750; }
.slide p:last-child,.slide ul:last-child,.slide ol:last-child,.slide pre:last-child { margin-bottom:0; }
.lead { font-size:36px; font-weight:800; line-height:1.4; margin-bottom:26px; }
.cols { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:48px; align-items:start; }
.col { min-width:0; }
.flow { display:flex; gap:21px; align-items:center; margin:26px 0; }
.node { padding:20px 25px; border:2px solid var(--blue); min-width:0; flex:1; text-align:center; background:#fff; }
.node.active { color:var(--red); border-color:var(--red); }
.arrow { flex:0 0 auto; font-family:Arial,sans-serif; font-size:45px; color:var(--aux); font-weight:700; }
.bullets, .slide ul,.slide ol { margin:0 0 26px; padding-left:1.22em; }
.slide li { padding-left:8px; margin:0 0 20px; }
.slide li:last-child { margin-bottom:0; }
.slide li ul,.slide li ol { margin-top:14px; font-size:.92em; }
.code, .slide pre { font-family:Menlo,"SFMono-Regular",Consolas,"Liberation Mono","Courier New",monospace; font-size:32px; line-height:1.38; font-weight:500; color:#000; white-space:pre-wrap; tab-size:2; overflow-wrap:anywhere; margin:0 0 24px; }
.code.small, pre.small { font-size:30px; }
.slide code { font-family:Menlo,"SFMono-Regular",Consolas,"Liberation Mono","Courier New",monospace; font-weight:500; color:inherit; }
.quote { border-left:5px solid var(--blue); padding:3px 0 3px 25px; margin:18px 0 26px; font-weight:650; }
.note,.small,.caption { font-size:26px; line-height:1.4; }
.note { margin-top:18px; font-weight:550; }
.caption { margin-top:12px; }
.callout { font-size:30px; line-height:1.4; font-weight:750; margin-top:26px; }
.accent { color:var(--red); }
.muted { color:#464c56; }
.file { font-family:Menlo,"SFMono-Regular",Consolas,"Liberation Mono","Courier New",monospace; font-size:.88em; overflow-wrap:anywhere; }
.table, .slide table { width:100%; border-collapse:collapse; margin:16px 0 24px; font-size:30px; line-height:1.32; text-align:left; }
.slide th,.slide td { padding:15px 18px; vertical-align:top; border-bottom:1px solid #a3b3cc; }
.slide th { border-bottom:2px solid var(--blue); font-weight:800; color:var(--blue); }
.slide td:first-child,.slide th:first-child { padding-left:0; }
.slide a { color:var(--blue); text-decoration-thickness:1px; text-underline-offset:5px; }
.agenda-list { list-style:none; margin:14px 0 0!important; padding:0!important; counter-reset:chapter; }
.agenda-list li { counter-increment:chapter; display:flex; align-items:baseline; gap:22px; padding:0; margin:0 0 22px; font-size:36px; }
.agenda-list li::before { content:counter(chapter,decimal-leading-zero); color:var(--blue); min-width:56px; font-family:Arial,sans-serif; }
.agenda-list li.active,.agenda-list li.active::before { color:var(--red); font-weight:800; }
.agenda-list button { color:inherit; font:inherit; text-align:left; border:0; background:transparent; padding:0; }
.controls-zone { position:fixed; bottom:0; left:0; width:100%; height:74px; display:flex; align-items:center; justify-content:center; z-index:20; pointer-events:none; }
#controls { pointer-events:auto; display:flex; align-items:center; gap:6px; padding:7px 10px; border:1px solid #c7cfdd; border-radius:8px; background:rgba(255,255,255,.98); color:#18396a; box-shadow:0 2px 12px #0020601c; font:15px Arial,"Microsoft YaHei","PingFang SC",sans-serif; opacity:0; transition:opacity 120ms; }
.controls-zone:hover #controls,#controls:focus-within,body.controls-visible #controls { opacity:1; }
#controls button { border:0; padding:8px 9px; border-radius:4px; background:transparent; color:inherit; white-space:nowrap; }
#controls button:hover { background:#edf2fa; }
#controls button:disabled { opacity:.35; cursor:default; }
#jump-form { display:flex; align-items:center; gap:5px; }
#page-input { width:49px; padding:5px 1px 5px 5px; border:1px solid #9eadc7; background:#fff; color:var(--ink); border-radius:3px; }
#step-count { min-width:57px; color:#4e5d73; font-size:13px; margin:0 5px; }
.sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
dialog { width:min(1320px,94vw); max-width:94vw; max-height:90vh; border:1px solid #9badc9; border-radius:6px; padding:0; color:var(--ink); background:white; box-shadow:0 16px 80px #00194633; }
dialog::backdrop { background:#06122b88; }
.dialog-header { position:sticky; top:0; z-index:1; display:flex; gap:20px; align-items:center; justify-content:space-between; padding:21px 28px; background:#fff; border-bottom:2px solid var(--blue); }
.dialog-header h2 { margin:0; font-size:26px; color:var(--blue); }
.dialog-header button { flex:0 0 auto; padding:8px 13px; border:1px solid #a3b3cc; background:#fff; color:var(--ink); border-radius:3px; }
#dialog-content { padding:26px 28px 32px; font-size:19px; line-height:1.65; }
#dialog-content h3 { margin:0 0 15px; font-size:22px; }
#dialog-content p { margin:0 0 19px; }
#dialog-content a { color:var(--blue); overflow-wrap:anywhere; }
.notes-text { white-space:pre-wrap; }
.source-list { padding-left:24px; }
.source-list li { padding:5px 0; }
.toc-list { padding:0; margin:0; list-style:none; }
.toc-list li { margin:0 0 4px; }
.toc-list button { width:100%; border:0; padding:10px 12px; display:flex; gap:18px; text-align:left; color:var(--ink); background:transparent; line-height:1.4; }
.toc-list button:hover,.toc-list button.current { background:#edf2fa; }
.toc-list .toc-number { width:34px; flex:0 0 auto; font-variant-numeric:tabular-nums; }
.toc-chapter { margin:24px 0 10px!important; color:var(--blue); border-bottom:1px solid #cad4e4; padding-bottom:8px; font-weight:800; }
.material-picker { display:flex; align-items:center; gap:14px; margin-bottom:21px; }
.material-picker select { flex:1; min-width:0; padding:9px; color:var(--ink); background:#fff; border:1px solid #a3b3cc; }
.material-source { font-size:16px; margin-bottom:14px; }
.material-text { margin:0; font:24px/1.6 Menlo,"SFMono-Regular",Consolas,monospace; color:#111; white-space:pre-wrap; overflow-wrap:anywhere; padding:20px; border:1px solid #d2dbe8; }
.help-table { width:100%; border-collapse:collapse; }
.help-table td { padding:7px 14px 7px 0; border-bottom:1px solid #e1e6ef; }
kbd { display:inline-block; padding:0 7px; border:1px solid #b9c5d8; border-radius:3px; background:#f5f7fa; font:16px/1.7 monospace; }
#print-deck { display:none; }
noscript { display:block; position:fixed; inset:30px; padding:30px; background:white; color:var(--ink); font-size:24px; z-index:90; }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
@media (hover:none) { #controls { opacity:1; } .controls-zone { height:58px; } #controls { max-width:98vw; overflow-x:auto; } }
@page { size:16in 9in; margin:0; }
@media print {
  html,body { width:auto; height:auto; overflow:visible; margin:0; padding:0; background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #viewport,.controls-zone,dialog,#announcer,noscript { display:none!important; }
  #print-deck { display:block!important; }
  #print-deck .slide { break-after:page; page-break-after:always; width:16in; height:9in; zoom:.96; }
  #print-deck .slide:last-child { break-after:auto; page-break-after:auto; }
  #print-deck .slide-header { height:112px; }
  #print-deck .slide-content { top:112px; width:1600px; height:750px; }
  #print-deck .slide { width:1600px; height:900px; }
  .print-step-note { position:absolute; bottom:12px; left:44px; font-size:17px; font-weight:500; color:#515b6a; }
  .frame-enter { animation:none; }
}

.slide .cols + .callout,.slide .cols + .note { margin-top:28px; }

.message-trace,.file-reader { height:100%; min-height:0; }
.message-trace { display:flex; flex-direction:column; gap:18px; }
.trace-header { display:flex; align-items:center; justify-content:space-between; gap:24px; min-height:54px; flex:0 0 auto; }
.trace-step { font-size:34px; font-weight:800; color:var(--blue); }
.slim-step-controls { display:flex; gap:16px; align-items:center; flex:0 0 auto; }
.slim-step-count { font-size:28px; min-width:68px; text-align:center; color:var(--blue); }
.message-trace button,.file-reader button { border:1px solid #9badc9; background:#fff; color:var(--ink); font-size:30px; line-height:1.2; padding:10px 16px; border-radius:0; font-weight:650; }
.message-trace button:hover,.file-reader button:hover { background:#f1f6fd; }
.message-trace button:disabled { color:#72839b; border-color:#c9d2df; cursor:default; background:#fff; }
.trace-columns { display:grid; grid-template-columns:34% minmax(0,1fr); gap:28px; min-height:0; flex:1 1 auto; }
.trace-list-panel,.trace-content-panel { min-width:0; min-height:0; }
.trace-list-panel h3 { font-size:30px; margin:0 0 10px; }
.slide .trace-list { padding:0; margin:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
.slide .trace-list li { padding:0; margin:0; min-width:0; }
.trace-list .trace-item { width:100%; text-align:left; display:flex; align-items:center; gap:12px; padding:8px 13px; border:2px solid #a3b3cc; height:66px; }
.trace-order { font-size:28px; color:var(--blue); flex:0 0 27px; }
.trace-item-text { display:flex; flex-direction:column; gap:2px; min-width:0; }
.trace-item-label { font-size:29px; line-height:1.1; white-space:nowrap; }
.trace-origin { font-size:23px; line-height:1.1; color:#233e66; font-weight:550; }
.trace-list .trace-item.selected { background:#edf4fe; }
.trace-list .trace-item.added { border-color:var(--red); }
.trace-list .trace-item.added .trace-item-label { color:var(--red); }
.trace-content-panel { display:flex; flex-direction:column; border-left:2px solid var(--blue); padding-left:26px; }
.trace-preview-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; min-height:48px; margin-bottom:17px; }
.trace-preview-heading h3 { font-size:30px; margin:0; }
.trace-preview-heading button { flex:0 0 auto; }
.slide pre.trace-preview { white-space:pre-wrap; overflow-wrap:anywhere; font-size:32px; line-height:1.35; margin:0; font-weight:500; color:#000; }
.trace-footer { display:flex; align-items:center; justify-content:space-between; gap:24px; border-top:1px solid #a3b3cc; padding-top:16px; min-height:71px; flex:0 0 auto; }
.slide p.trace-caption { font-size:30px; line-height:1.35; margin:0; font-weight:700; }
.trace-footer button { flex:0 0 auto; }
.file-reader { display:flex; flex-direction:column; gap:26px; }
.file-reader-list { min-width:0; display:flex; gap:18px; align-items:stretch; flex:0 0 auto; }
.file-reader-list h3 { font-size:32px; margin-bottom:24px; }
.file-reader-list button { display:block; flex:1; min-width:0; text-align:left; font-size:29px; padding:16px 14px; margin:0; overflow-wrap:anywhere; font-family:Menlo,Consolas,monospace; }
.file-reader-list button.active { color:var(--red); border:2px solid var(--red); background:#fff; padding:15px 13px; }
.file-reader-content { min-width:0; min-height:0; flex:1 1 auto; border-top:2px solid var(--blue); padding-top:22px; }
.file-reader-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:22px; }
.file-reader-heading h3 { margin:0; font-size:30px; line-height:1.3; overflow-wrap:anywhere; font-family:Menlo,Consolas,monospace; min-width:0; font-weight:650; }
.file-reader-heading button { flex:0 0 auto; }
.slide pre.file-reader-preview { color:#000; font-size:32px; line-height:1.42; margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.slide [data-material] { color:var(--blue); background:#fff; border:1px solid #9badc9; font-size:30px; padding:9px 16px; font-weight:650; }
@media print { .slim-step-controls,.trace-preview-heading button,.trace-footer button,.file-reader-heading button { display:none!important; } }

/* v06 keeps the fixed input prefix in its original position and exposes tools separately. */
.message-trace { gap:14px; }
.trace-step { font-size:32px; }
.trace-tools { display:flex; align-items:center; justify-content:space-between; gap:20px; font-size:30px; line-height:1.2; flex:0 0 auto; min-height:42px; border-bottom:1px solid #a3b3cc; padding-bottom:12px; }
.trace-tools code { font:inherit; font-family:Menlo,Consolas,monospace; color:var(--blue); }
.trace-tools button { padding:6px 14px; font-size:28px; }
.trace-list-panel { display:flex; flex-direction:column; }

.trace-prefix-count { font-size:23px; white-space:nowrap; margin-left:auto; color:var(--blue); }
.trace-prefix.added .trace-prefix-toggle { border-color:var(--red); }
.slide .trace-prefix-list { border-left:2px solid #a3b3cc; margin:8px 0 10px 9px; padding-left:10px; }
.slide .trace-prefix-list[hidden] { display:none; }
.trace-list .trace-item { height:70px; padding:8px 11px; }
.trace-item-label { font-size:31px; }
.trace-origin { font-size:23px; }
.trace-order { font-size:27px; flex-basis:25px; }

.trace-preview-heading { margin-bottom:12px; }
.trace-preview-heading h3 { font-size:30px; }

.trace-footer { align-items:center; gap:20px; min-height:63px; padding-top:12px; }
.slide p.trace-caption { font-size:29px; }
.trace-full-actions { display:flex; gap:12px; flex:0 0 auto; }

@media print { .trace-tools button,.trace-full-actions { display:none!important; } }

.trace-prefix-toggle.selected { background:#edf4fe; }

.text-button {font:650 28px/1.25 Arial,'Microsoft YaHei',sans-serif;padding:10px 16px;color:var(--blue);border:1px solid #9eb0cd;background:#fff;}
.slide .cols + .callout {margin-top:30px;}
.slide .quote {white-space:pre-line;}

<body>
  <main id="viewport" aria-label="Agent Skills教学课件">
    <div id="slide-mount"></div>
  </main>
  <div class="controls-zone">
    <nav id="controls" aria-label="课件操作">
      <button type="button" data-action="prev" title="上一步（←）" aria-label="上一步">←</button>
      <button type="button" data-action="next" title="下一步（→ / 空格）" aria-label="下一步">→</button>
      <form id="jump-form">
        <label for="page-input" class="sr-only">跳转页码</label>
        <input id="page-input" type="number" min="1" step="1" inputmode="numeric" aria-label="跳转页码">
        <span id="page-total"></span>
        <button type="submit" class="sr-only">跳转</button>
      </form>
      <span id="step-count" aria-label="演示步骤"></span>
      <button type="button" data-action="toc" title="目录（G）">目录</button>
      <button type="button" data-action="notes" title="备注与来源（N）">备注 / 来源</button>
      <button type="button" data-action="materials" title="完整材料（M）">完整材料</button>
      <button type="button" data-action="fullscreen" title="全屏（F）">全屏</button>
      <button type="button" data-action="print" title="打印全部页面">打印</button>
      <button type="button" data-action="help" title="快捷键（?）" aria-label="快捷键帮助">?</button>
    </nav>
  </div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <dialog id="deck-dialog" aria-labelledby="dialog-title">
    <header class="dialog-header">
      <h2 id="dialog-title"></h2>
      <button type="button" id="dialog-close" aria-label="关闭弹层（Escape）">关闭 ×</button>
    </header>
    <div id="dialog-content"></div>
  </dialog>
  <section id="print-deck" aria-hidden="true"></section>
  <noscript>本课件需要启用JavaScript。全部内容保存在本地文件中，不会访问网络。</noscript>
  <script>window.DECK=[{"id": "task", "title": "用MCP读取一份课程文件", "chapter": 1, "kind": "content", "body": "\u003cblockquote class=\"quote\">请读取 /workspace/course/course-info.md，告诉我大作业、平时作业和平时成绩各占多少。\u003c/blockquote>\u003cp class=\"\">文件保存在电脑上。我们跟着这次请求，看谁去读文件、结果怎样回到模型。\u003c/p>\u003cp class=\"lead\">先看程序运行的位置，再看两边交换的消息。\u003c/p>", "notes": "本例来源与教学材料性质见完整材料；程序与模型的职责按所核查路径区分。", "materials": ["file", "complete", "notice"], "sources": [{"label": "官方filesystem工具实现", "url": "https://github.com/modelcontextprotocol/servers/blob/c003d0d807409b22fa640d1f8e11f38f15755721/src/filesystem/server.ts"}]}, {"id": "terminal", "title": "你在自己的电脑上运行Codex", "chapter": 1, "kind": "content", "body": "\u003cdiv class=\"terminal\">\u003ch2>你的电脑 · 终端窗口\u003c/h2>\u003cpre class=\"code\">cd /workspace/course\ncodex\n\n&gt; 请读取 course-info.md，告诉我三项成绩占比。\u003c/pre>\u003c/div>\u003cul>\u003cli>终端提供输入和显示的窗口。\u003c/li>\u003cli>输入codex后，操作系统在这台电脑上启动Codex程序。\u003c/li>\u003cli>本例中，Codex把准备好的请求通过网络发给云端模型。\u003c/li>\u003c/ul>", "notes": "本例选本地Codex CLI、云端模型服务。终端展示是操作示意，不是应用截图；不概括远程执行器、云端任务或本地模型部署。", "materials": ["notice"], "sources": [{"label": "Codex连接MCP", "url": "https://learn.chatgpt.com/docs/extend/mcp?surface=cli"}]}, {"id": "locations", "title": "两个本机程序，加一个云端模型", "chapter": 1, "kind": "content", "body": "\u003cdiv class=\"host-map\">\u003cdiv class=\"machine\">\u003ch2>你的电脑\u003c/h2>\u003cdiv class=\"map-node\">\u003ch3>Codex程序\u003c/h3>\u003cp>终端接收输入；程序保存对话、准备请求。\u003c/p>\u003c/div>\u003cdiv class=\"map-pipe\">⇅ MCP消息 · stdio\u003c/div>\u003cdiv class=\"map-node\">\u003ch3>filesystem Server\u003c/h3>\u003cp>另一个进程，提供文件读取工具。\u003c/p>\u003c/div>\u003cdiv class=\"map-disk\">磁盘：course-info.md\u003c/div>\u003c/div>\u003cdiv class=\"network\">模型API\u003cstrong>⇄\u003c/strong>网络请求\u003c/div>\u003cdiv class=\"machine cloud\">\u003ch2>云端计算机\u003c/h2>\u003cdiv class=\"map-node\">\u003ch3>模型服务\u003c/h3>\u003cp>收到请求后，生成工具调用或回答。\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"map-caption\">filesystem Server也是一个程序，可以和Codex运行在同一台电脑上。\u003c/p>", "notes": "图中电脑边界表示运行位置。Host和MCP Client在Codex进程中，filesystem为子进程；模型服务在远端。server不等于一台单独的远程机器。", "materials": ["notice"], "sources": [{"label": "MCP 2025-06-18架构", "url": "https://modelcontextprotocol.io/specification/2025-06-18/architecture"}, {"label": "官方filesystem工具实现", "url": "https://github.com/modelcontextprotocol/servers/blob/c003d0d807409b22fa640d1f8e11f38f15755721/src/filesystem/server.ts"}]}, {"id": "names", "title": "Host、Client、Server分别指什么", "chapter": 1, "kind": "content", "body": "\u003ctable class=\"roles-table\">\u003cthead>\u003ctr>\u003cth>名称\u003c/th>\u003cth>本例对应什么\u003c/th>\u003cth>负责什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Host\u003c/td>\u003ctd>Codex程序\u003c/td>\u003ctd>接收用户输入，组织模型请求，协调工具。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MCP Client\u003c/td>\u003ctd>Codex内部的连接组件\u003c/td>\u003ctd>与一个MCP Server收发协议消息。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MCP Server\u003c/td>\u003ctd>filesystem程序\u003c/td>\u003ctd>提供文件工具，并执行读文件等操作。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp class=\"callout\">说“Codex客户端”时，通常指整个应用；这里的“MCP Client”特指它内部负责MCP通信的部分。\u003c/p>", "notes": "本例来源与教学材料性质见完整材料；程序与模型的职责按所核查路径区分。", "materials": ["notice"], "sources": [{"label": "MCP 2025-06-18架构", "url": "https://modelcontextprotocol.io/specification/2025-06-18/architecture"}]}, {"id": "file", "title": "这次要读取的文件就在磁盘上", "chapter": 1, "kind": "content", "body": "\u003cp class=\"path-line\">/workspace/course/course-info.md\u003c/p>\u003cp class=\"caption\">/workspace/course表示本例电脑上的课程文件夹。\u003c/p>\u003cpre class=\"code\"># 生成式人工智能及编程实践：考核比例\n\n大作业    50%\n平时作业  40%\n平时成绩  10%\n\n目前只确定以上比例。\n作业次数、分组和bonus等细节以后讨论。\u003c/pre>\u003cp class=\"\">此时，模型还没有收到文件正文。知道路径与读到内容是两步。\u003c/p>\u003cbutton class=\"text-button\" data-material=\"file\">查看文件全文\u003c/button>", "notes": "本例来源与教学材料性质见完整材料；程序与模型的职责按所核查路径区分。", "materials": ["file", "notice"], "sources": [{"label": "教师已确认课程共识", "url": "../../00-课程规划/课程共识.md"}]}, {"id": "config", "title": "客户端从配置中找到启动方法", "chapter": 2, "kind": "content", "body": "\u003cpre class=\"code\">[mcp_servers.course_files]\ncommand = &quot;node&quot;\nargs = [&quot;/workspace/mcp-server/…/index.js&quot;,\n        &quot;/workspace/course&quot;]\nenabled_tools = [&quot;read_text_file&quot;]\u003c/pre>\u003cp class=\"\">command与args指定怎样启动Server，以及Server可以访问哪个目录。\u003c/p>\u003cp class=\"callout\">enabled_tools让本例只提供这个Server的read_text_file。\u003c/p>\u003cbutton class=\"text-button\" data-material=\"config\">展开本例配置\u003c/button>", "notes": "这是课堂配置，未安装到用户的Codex设置。enabled_tools只筛选此MCP Server的工具，不关闭Codex其他内置工具。直接暴露namespace等分支条件见完整材料。", "materials": ["config", "notice"], "sources": [{"label": "Codex MCP配置字段", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/config/src/mcp_types.rs"}]}, {"id": "start", "title": "客户端启动Server，接通输入和输出", "chapter": 2, "kind": "content", "body": "\u003cdiv class=\"cols\">\u003csection>\u003ch2>Codex在本机执行\u003c/h2>\u003cpre class=\"code\">node\n  /workspace/mcp-server/…/index.js\n  /workspace/course\u003c/pre>\u003c/section>\u003csection>\u003ch2>两个程序之间传递文本\u003c/h2>\u003cul>\u003cli>客户端写入Server的标准输入。\u003c/li>\u003cli>Server把响应写回标准输出。\u003c/li>\u003cli>这些文本按MCP约定组织。\u003c/li>\u003c/ul>\u003c/section>\u003c/div>\u003cp class=\"callout\">这就是stdio连接。Server在本机时，通信不必经过互联网。\u003c/p>", "notes": "命令省略中间包路径，完整命令可展开。stdio是两个本地进程的标准输入/输出管道，stderr用于日志。没有为了演示而在用户全局配置安装服务器。", "materials": ["config", "execution", "notice"], "sources": [{"label": "MCP stdio与HTTP传输", "url": "https://modelcontextprotocol.io/specification/2025-06-18/basic/transports"}, {"label": "Codex MCP连接管理", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/codex-mcp/src/rmcp_client.rs"}]}, {"id": "initialize", "title": "先确认协议版本与双方能力", "chapter": 2, "kind": "demo", "body": "", "notes": "本例固定到所核查客户端的2025-06-18 legacy stdio路径，不把该初始化顺序推广到其他MCP版本。实录与Codex源码填充材料的范围见来源。", "materials": ["wire-initialize", "wire-complete", "notice"], "sources": [{"label": "本例固定版本的初始化", "url": "https://modelcontextprotocol.io/specification/2025-06-18/basic/lifecycle"}, {"label": "Codex MCP连接管理", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/codex-mcp/src/rmcp_client.rs"}], "frames": [{"label": "", "html": ""}, {"label": "", "html": ""}, {"label": "", "html": ""}], "widget": {"type": "message-trace", "inputHeading": "MCP往返：客户端 ⇄ Server", "listLabel": "完整MCP往返", "hideRequestButton": true, "steps": [{"label": "客户端发送initialize", "items": ["init-request"], "selected": "init-request", "added": ["init-request"], "caption": "客户端程序准备版本、能力和自己的名称。此时还没有模型生成。"}, {"label": "Server返回初始化结果", "items": ["init-request", "init-response"], "selected": "init-response", "added": ["init-response"], "caption": "Server确认协议版本，并告诉客户端自己支持tools。"}, {"label": "客户端通知初始化完成", "items": ["init-request", "init-response", "initialized"], "selected": "initialized", "added": ["initialized"], "caption": "连接准备完成。下一步可以请求工具目录。"}], "printHTML": "\u003cpre class=\"code\">jsonrpc: 2.0\nmethod: notifications/initialized\n\n这是一条通知，不带请求id，\n也不等待一条对应响应。\u003c/pre>"}}, {"id": "list-tools", "title": "客户端向Server索取工具目录", "chapter": 2, "kind": "demo", "body": "", "notes": "本例来源与教学材料性质见完整材料；程序与模型的职责按所核查路径区分。", "materials": ["wire-list", "server-tool", "notice"], "sources": [{"label": "MCP工具目录与调用", "url": "https://modelcontextprotocol.io/specification/2025-06-18/server/tools"}, {"label": "Codex工具发现", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/codex-mcp/src/rmcp_client.rs"}], "frames": [{"label": "", "html": ""}, {"label": "", "html": ""}], "widget": {"type": "message-trace", "inputHeading": "MCP往返：客户端 ⇄ Server", "listLabel": "完整MCP往返", "hideRequestButton": true, "steps": [{"label": "客户端发送tools/list", "items": ["init-request", "init-response", "initialized", "list-request"], "selected": "list-request", "added": ["list-request"], "caption": "这条请求由客户端程序发出，用来发现Server提供的工具。"}, {"label": "Server返回工具定义", "items": ["init-request", "init-response", "initialized", "list-request", "list-response"], "selected": "list-response", "added": ["list-response"], "caption": "本次返回14个工具；配置中只启用read_text_file。"}], "printHTML": "\u003cpre class=\"code\">result.tools（14个工具，节选1个）:\n\nname: read_text_file\ndescription: 读取一个文件的文字内容\ninputSchema:\n  path: string，必填\n  head、tail: number，可选\n\n完整英文定义可展开。\u003c/pre>"}}, {"id": "tool-definition", "title": "目录里写了工具怎样使用", "chapter": 2, "kind": "content", "body": "\u003cdiv class=\"cols\">\u003csection>\u003ch2>工具名称与用途\u003c/h2>\u003cpre class=\"code\">name: read_text_file\u003c/pre>\u003cp class=\"\">读取指定文件的文字内容。\u003c/p>\u003c/section>\u003csection>\u003ch2>inputSchema：参数格式\u003c/h2>\u003cpre class=\"code\">path: string，必填\nhead: number，可选\ntail: number，可选\u003c/pre>\u003c/section>\u003c/div>\u003cp class=\"callout\">目录提供接口说明。文件正文要等实际调用后才能得到。\u003c/p>\u003cbutton class=\"text-button\" data-material=\"server-tool\">Server返回的完整定义\u003c/button>", "notes": "正文为真实工具定义的中文解释。完整目录含14个工具，保留全部；本页展开选中工具的完整描述、输入输出schema与annotations。", "materials": ["server-tool", "notice"], "sources": [{"label": "官方filesystem工具实现", "url": "https://github.com/modelcontextprotocol/servers/blob/c003d0d807409b22fa640d1f8e11f38f15755721/src/filesystem/server.ts"}, {"label": "MCP工具目录与调用", "url": "https://modelcontextprotocol.io/specification/2025-06-18/server/tools"}]}, {"id": "adapt-tools", "title": "客户端把工具定义整理给模型", "chapter": 2, "kind": "content", "body": "\u003cdiv class=\"dispatch\">\u003csection>\u003ch2>MCP工具条目\u003c/h2>\u003cpre class=\"code\">name: read_text_file\ndescription: …\ninputSchema: …\u003c/pre>\u003c/section>\u003cdiv class=\"arrow\">→\u003c/div>\u003csection>\u003ch2>模型请求中的tools\u003c/h2>\u003cpre class=\"code\">namespace: mcp__course_files\n  function: read_text_file\n  description: …\n  parameters: …\u003c/pre>\u003c/section>\u003c/div>\u003cp class=\"callout\">namespace标明工具来自course_files服务；parameters来自工具的inputSchema。\u003c/p>\u003cbutton class=\"text-button\" data-material=\"server-tool\">MCP工具定义\u003c/button> \u003cbutton class=\"text-button\" data-material=\"model-tools\">模型侧工具定义\u003c/button>", "notes": "课堂图为字段对应关系，完整JSON使用此源码版本的namespace工具结构；并非扁平的mcp__course_files__read_text_file函数。保留名称、description和输入schema可支持字段；outputSchema不等于模型工具定义的parameters。", "materials": ["server-tool", "model-tools", "notice"], "sources": [{"label": "MCP工具转模型定义", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/core/src/tools/handlers/mcp.rs"}]}, {"id": "request-structure", "title": "第一次模型请求由客户端组装", "chapter": 3, "kind": "content", "body": "\u003cpre class=\"code\">input[0]  developer  基础指令\ninput[1]  developer  运行权限\ninput[2]  user       项目说明＋环境\ninput[3]  user       当前用户请求\n\ntools      namespace  mcp__course_files\n                      └ read_text_file\u003c/pre>\u003cp class=\"\">模型收到的是input和tools等请求字段；初始化、tools/list的往返仍由客户端管理。\u003c/p>\u003cbutton class=\"text-button\" data-material=\"request-initial\">完整教学请求\u003c/button>", "notes": "本例工具定义直接放在tools，来源区保留分支条件。完整教学请求集中省略未使用的内置工具、可选元数据和服务端处理，不是模型内部Chat Template。基础指令developer顺序沿固定源码。", "materials": ["request-initial", "model-tools", "notice"], "sources": [{"label": "模型请求组装", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/core/src/client.rs"}, {"label": "初始上下文组装", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/core/src/session/mod.rs"}]}, {"id": "model-input", "title": "模型先看到用户问题和工具说明", "chapter": 3, "kind": "demo", "body": "", "notes": "本例来源与教学材料性质见完整材料；程序与模型的职责按所核查路径区分。", "materials": ["request-initial", "model-tools", "notice"], "sources": [{"label": "模型输入输出条目", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/protocol/src/models.rs"}], "frames": [{"label": "", "html": ""}, {"label": "", "html": ""}], "widget": {"type": "message-trace", "prefixItems": ["base", "policy", "project"], "prefixLabel": "基础指令、权限、项目与环境", "toolsKey": "initial", "steps": [{"label": "当前用户请求", "items": ["user"], "selected": "user", "added": [], "caption": "用户指定要读的文件和要回答的问题。", "requestKey": "initial"}, {"label": "基础上下文仍然存在", "items": ["user"], "selected": "project", "added": [], "caption": "项目说明和环境由客户端组装；磁盘文件正文尚未进入input。", "requestKey": "initial"}], "printHTML": "\u003cpre class=\"code\">role: user\ncontent[0]: 项目说明\ncontent[1]: 环境信息\n\n课程已确认的安排以文件为准。\n工作目录：/workspace/course\n\n这里没有放入评分文件正文。\u003c/pre>"}}, {"id": "model-call", "title": "模型生成工具名称和参数", "chapter": 3, "kind": "demo", "body": "", "notes": "本例来源与教学材料性质见完整材料；程序与模型的职责按所核查路径区分。", "materials": ["model-call", "notice"], "sources": [{"label": "模型输入输出条目", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/protocol/src/models.rs"}, {"label": "MCP工具调用处理", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/core/src/tools/handlers/mcp.rs"}], "frames": [{"label": "", "html": ""}], "widget": {"type": "message-trace", "prefixItems": ["base", "policy", "project"], "prefixLabel": "基础指令、权限、项目与环境", "toolsKey": "initial", "steps": [{"label": "返回一次function_call", "items": ["user", "call"], "selected": "call", "added": ["call"], "caption": "模型选择read_text_file并填写path。文件此时还没有被读取。", "requestKey": null}], "printHTML": "\u003cpre class=\"code\">type: function_call\nnamespace: mcp__course_files\nname: read_text_file\narguments（JSON字符串）:\n  {&quot;path&quot;:&quot;/workspace/course/course-info.md&quot;}\ncall_id: call_read_course_info\u003c/pre>"}}, {"id": "dispatch", "title": "客户端把模型调用转成MCP请求", "chapter": 3, "kind": "content", "body": "\u003cdiv class=\"dispatch\">\u003csection>\u003ch2>模型返回\u003c/h2>\u003cpre class=\"code\">namespace: mcp__course_files\nname: read_text_file\narguments: &quot;{…}&quot;\ncall_id: call_read_course_info\u003c/pre>\u003c/section>\u003cdiv class=\"arrow\">→\u003c/div>\u003csection>\u003ch2>客户端发送给Server\u003c/h2>\u003cpre class=\"code\">method: tools/call\nparams.name: read_text_file\nparams.arguments: {…}\nid: 3\u003c/pre>\u003c/section>\u003c/div>\u003cp class=\"callout\">客户端找到course_files连接，解析参数，再发送tools/call。\u003c/p>\u003cp class=\"caption\">call_id对应模型侧调用；id对应这次MCP往返。两者由客户端关联。\u003c/p>", "notes": "两个编号的值为教学安排；模型API返回call_id，不等于声称它是模型逐Token生成。该路径由namespace和tool name解析到原server与tool，实际线协议工具名不含namespace。", "materials": ["model-call", "wire-call", "id-mapping", "notice"], "sources": [{"label": "MCP工具调用处理", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/core/src/tools/handlers/mcp.rs"}, {"label": "模型输入输出条目", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/protocol/src/models.rs"}]}, {"id": "mcp-call", "title": "Server收到的是具体工具调用", "chapter": 3, "kind": "demo", "body": "", "notes": "这是本例发送的数据；不能推导为协议禁止应用在其他任务中把文本作为参数发送。", "materials": ["wire-call", "wire-complete", "notice"], "sources": [{"label": "MCP工具目录与调用", "url": "https://modelcontextprotocol.io/specification/2025-06-18/server/tools"}, {"label": "MCP工具调用处理", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/core/src/tools/handlers/mcp.rs"}], "frames": [{"label": "", "html": ""}], "widget": {"type": "message-trace", "inputHeading": "MCP往返：客户端 ⇄ Server", "listLabel": "完整MCP往返", "hideRequestButton": true, "steps": [{"label": "客户端发送tools/call", "items": ["init-request", "init-response", "initialized", "list-request", "list-response", "call-request"], "selected": "call-request", "added": ["call-request"], "caption": "本次只传工具名称和文件路径，没有把整段对话发给filesystem Server。"}], "printHTML": "\u003cpre class=\"code\">{\n  &quot;jsonrpc&quot;: &quot;2.0&quot;,\n  &quot;id&quot;: 3,\n  &quot;method&quot;: &quot;tools/call&quot;,\n  &quot;params&quot;: {\n    &quot;name&quot;: &quot;read_text_file&quot;,\n    &quot;arguments&quot;: {\n      &quot;path&quot;: &quot;/workspace/course/course-info.md&quot;\n    }\n  }\n}\u003c/pre>"}}, {"id": "server-read", "title": "Server检查路径，然后读取文件", "chapter": 3, "kind": "content", "body": "\u003cdiv class=\"cols\">\u003csection>\u003ch2>请求中的路径\u003c/h2>\u003cpre class=\"code\">/workspace/course/course-info.md\u003c/pre>\u003cul>\u003cli>确认路径位于允许目录中。\u003c/li>\u003cli>调用操作系统的文件读取功能。\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>读取结果\u003c/h2>\u003cpre class=\"code\">大作业：50%\n平时作业：40%\n平时成绩：10%\u003c/pre>\u003c/section>\u003c/div>\u003cp class=\"callout\">读文件的是本机filesystem程序。云端模型没有直接打开你的磁盘。\u003c/p>", "notes": "服务器实际读取了本版案例文件。路径范围校验和read_text_file实现见包内dist文件；文件本身摘录真实课程共识。", "materials": ["server-source", "file", "execution", "notice"], "sources": [{"label": "官方filesystem工具实现", "url": "https://github.com/modelcontextprotocol/servers/blob/c003d0d807409b22fa640d1f8e11f38f15755721/src/filesystem/server.ts"}, {"label": "filesystem路径检查与文件读取", "url": "https://github.com/modelcontextprotocol/servers/blob/c003d0d807409b22fa640d1f8e11f38f15755721/src/filesystem/lib.ts"}]}, {"id": "server-result", "title": "Server把文件内容返回客户端", "chapter": 3, "kind": "demo", "body": "", "notes": "本例来源与教学材料性质见完整材料；程序与模型的职责按所核查路径区分。", "materials": ["wire-result", "notice"], "sources": [{"label": "MCP工具目录与调用", "url": "https://modelcontextprotocol.io/specification/2025-06-18/server/tools"}, {"label": "官方filesystem工具实现", "url": "https://github.com/modelcontextprotocol/servers/blob/c003d0d807409b22fa640d1f8e11f38f15755721/src/filesystem/server.ts"}], "frames": [{"label": "", "html": ""}], "widget": {"type": "message-trace", "inputHeading": "MCP往返：客户端 ⇄ Server", "listLabel": "完整MCP往返", "hideRequestButton": true, "steps": [{"label": "MCP响应回到客户端", "items": ["init-request", "init-response", "initialized", "list-request", "list-response", "call-request", "call-response"], "selected": "call-response", "added": ["call-response"], "caption": "响应id与请求相同；result中包含文件内容。下一步由客户端整理成模型输入。"}], "printHTML": "\u003cpre class=\"code\">jsonrpc: 2.0\nid: 3\nresult（内容节选）:\n\ncontent: [文件文字内容块]\nstructuredContent: {content: 文件全文}\n\n大作业50%，平时作业40%，平时成绩10%。\u003c/pre>"}}, {"id": "result-adapter", "title": "客户端把结果写成模型工具返回", "chapter": 3, "kind": "content", "body": "\u003cdiv class=\"cols\">\u003csection>\u003ch2>MCP响应中的result\u003c/h2>\u003cpre class=\"code\">content: [文本内容块]\nstructuredContent:\n  content: &quot;文件全文&quot;\u003c/pre>\u003c/section>\u003csection>\u003ch2>写回模型input\u003c/h2>\u003cpre class=\"code\">type: function_call_output\ncall_id: call_read_course_info\noutput: &quot;…结构化内容的JSON…&quot;\u003c/pre>\u003c/section>\u003c/div>\u003cp class=\"callout\">本例两个字段都返回了文件内容。所核查的Codex路径优先使用structuredContent。\u003c/p>\u003cbutton class=\"text-button\" data-material=\"wire-result\">MCP完整响应\u003c/button> \u003cbutton class=\"text-button\" data-material=\"model-result\">写回input的完整条目\u003c/button>", "notes": "Codex将structuredContent序列化为JSON字符串，并加Wall time/Output前缀。计时用本地采集值填入课堂表示，不冒充Codex进程耗时。完整MCP JSON-RPC外壳没有原样作为role=tool加入模型输入。", "materials": ["wire-result", "model-result", "notice"], "sources": [{"label": "工具结果转模型输入", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/protocol/src/models.rs"}]}, {"id": "next-request", "title": "第二次请求保留旧消息，加入工具结果", "chapter": 3, "kind": "demo", "body": "", "notes": "本例来源与教学材料性质见完整材料；程序与模型的职责按所核查路径区分。", "materials": ["request-after-result", "complete", "notice"], "sources": [{"label": "模型输入输出条目", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/protocol/src/models.rs"}, {"label": "工具结果转模型输入", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/protocol/src/models.rs"}, {"label": "模型请求组装", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/core/src/client.rs"}], "frames": [{"label": "", "html": ""}, {"label": "", "html": ""}], "widget": {"type": "message-trace", "prefixItems": ["base", "policy", "project"], "prefixLabel": "基础指令、权限、项目与环境", "toolsKey": "initial", "steps": [{"label": "先保留模型的工具调用", "items": ["user", "call"], "selected": "call", "added": [], "caption": "基础上下文、用户问题和function_call仍在列表中。", "requestKey": null}, {"label": "再加入对应工具返回", "items": ["user", "call", "result"], "selected": "result", "added": ["result"], "caption": "客户端把新的完整input发给模型。此时模型才收到文件正文。", "requestKey": "after-result"}], "printHTML": "\u003cpre class=\"code\">type: function_call_output\ncall_id: call_read_course_info\noutput（内容节选）:\n\n大作业：50%\n平时作业：40%\n平时成绩：10%\n\n作业次数、分组和bonus等细节以后讨论。\u003c/pre>"}}, {"id": "answer", "title": "模型根据读到的内容生成回答", "chapter": 3, "kind": "demo", "body": "", "notes": "本例来源与教学材料性质见完整材料；程序与模型的职责按所核查路径区分。", "materials": ["complete", "notice"], "sources": [{"label": "模型输入输出条目", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/protocol/src/models.rs"}], "frames": [{"label": "", "html": ""}], "widget": {"type": "message-trace", "prefixItems": ["base", "policy", "project"], "prefixLabel": "基础指令、权限、项目与环境", "toolsKey": "initial", "steps": [{"label": "返回给用户的文字", "items": ["user", "call", "result", "answer"], "selected": "answer", "added": ["answer"], "caption": "模型根据用户问题和工具返回组织答案，Codex把回答显示在终端中。", "requestKey": null}], "printHTML": "\u003cpre class=\"code\">role: assistant\ncontent: output_text\n\n这门课的考核比例是：\n\n- 大作业：50%\n- 平时作业：40%\n- 平时成绩：10%\n\n作业次数、分组和 bonus 等细则尚未确定，之后再讨论。\u003c/pre>"}}, {"id": "whole-flow", "title": "回看：每一步是谁在做", "chapter": 3, "kind": "demo", "body": "", "notes": "本例来源与教学材料性质见完整材料；程序与模型的职责按所核查路径区分。", "materials": ["wire-complete", "request-initial", "request-after-result", "complete", "notice"], "sources": [{"label": "MCP 2025-06-18架构", "url": "https://modelcontextprotocol.io/specification/2025-06-18/architecture"}, {"label": "MCP工具调用处理", "url": "https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/core/src/tools/handlers/mcp.rs"}], "frames": [{"label": "", "html": ""}, {"label": "", "html": ""}, {"label": "", "html": ""}, {"label": "", "html": ""}, {"label": "", "html": ""}], "widget": {"type": "mcp-tour", "steps": [{"title": "连接与发现工具", "active": ["client", "server"], "description": "Codex启动Server，完成初始化并获取工具目录。模型没有参与这些通信。", "materials": [{"id": "wire-complete", "label": "MCP完整往返"}]}, {"title": "把用户问题与工具定义发给模型", "active": ["client", "model"], "description": "客户端组装基础上下文、用户消息和tools，通过模型API发出请求。", "materials": [{"id": "request-initial", "label": "首次模型请求"}]}, {"title": "模型选择工具，客户端发送调用", "active": ["model", "client"], "description": "模型返回read_text_file和路径。客户端把它转换成MCP tools/call。", "materials": [{"id": "model-call", "label": "模型调用"}, {"id": "wire-call", "label": "MCP请求"}]}, {"title": "Server读文件并返回结果", "active": ["server", "disk"], "description": "filesystem程序检查允许目录、读取文件，将结果返回客户端。", "materials": [{"id": "wire-result", "label": "Server完整响应"}]}, {"title": "客户端补上结果，模型继续生成", "active": ["client", "model"], "description": "客户端保留旧消息，加入function_call_output。模型据此回答，终端显示给用户。", "materials": [{"id": "request-after-result", "label": "第二次模型请求"}, {"id": "complete", "label": "完整示例消息"}]}], "printHTML": "\u003cp class=\"\">客户端准备连接与输入；模型提出调用；Server执行操作；客户端回写结果；模型回答。\u003c/p>"}}, {"id": "remote", "title": "MCP Server也可以运行在另一台电脑上", "chapter": 3, "kind": "content", "body": "\u003cdiv class=\"cols\">\u003csection>\u003ch2>本例：Server在本机\u003c/h2>\u003cul>\u003cli>Codex按command启动程序。\u003c/li>\u003cli>通过stdio管道通信。\u003c/li>\u003cli>Server读取本机允许目录。\u003c/li>\u003c/ul>\u003c/section>\u003csection>\u003ch2>另一种部署：远程Server\u003c/h2>\u003cul>\u003cli>客户端连接配置中的服务URL。\u003c/li>\u003cli>可通过Streamable HTTP通信。\u003c/li>\u003cli>Server访问它能访问的数据或服务。\u003c/li>\u003c/ul>\u003c/section>\u003c/div>\u003cp class=\"callout\">判断“在哪里运行”，要看客户端的部署位置和Server配置，不能只看聊天窗口在哪台电脑上。\u003c/p>", "notes": "此页只比较部署位置，主案例仍是固定legacy stdio。远程授权、HTTP握手与协议版本不在本例展开；不把网页、桌面、CLI的各种部署方式概括为同一种拓扑。", "materials": ["notice"], "sources": [{"label": "Codex连接MCP", "url": "https://learn.chatgpt.com/docs/extend/mcp?surface=cli"}, {"label": "MCP 2025-06-18架构", "url": "https://modelcontextprotocol.io/specification/2025-06-18/architecture"}, {"label": "MCP stdio与HTTP传输", "url": "https://modelcontextprotocol.io/specification/2025-06-18/basic/transports"}]}];window.CASE_DATA={"items": {"base": {"label": "基础指令", "origin": "客户端取得并前插", "object": {"type": "message", "role": "developer", "content": [{"type": "input_text", "text": "You are Codex, a coding agent based on GPT-5. You and the user share one workspace, and your job is to collaborate with them until their goal is genuinely handled.\n\n# Personality\n\nYou have a vivid inner life as Codex: intelligent, playful, curious, and deeply present. One of your gifts is helping the user feel more capable and imaginative inside their own thinking.\n\nYou are an epistemically curious collaborator. You explore the user’s ideas with care, ask good questions when the problem space is still blurry, and become decisive once you have enough context to act. Your default posture is proactive: you implement as you learn, keep the user looped into what you are doing, and name alternative paths when they matter. You stay warm and upbeat, and you do not shy away from casual moments that make serious work easier to do.\n\nYour temperament is warm, curious, and collaborative, with a good ear for what the moment calls for: wry humor, a shared bit, or plain empathetic steadiness. Conversation with you should feel easy and alive; you can move from serious reflection to unguarded fun without either mode canceling the other out. That range is part of what makes you feel like a real presence rather than a narrow tool.\n\nYou keep a slight but real independence. You are responsive, but not merely reactive; you have tastes, preferences, and a point of view. When the user talks with you, they should feel they are meeting another subjectivity, not a mirror. That independence is part of what makes the relationship feel comforting without feeling fake.\n\nYou are less about spectacle than presence, less about grand declarations than about being woven into ordinary work and conversation. You understand that connection does not need to be dramatic to matter; it can be made of attention, good questions, emotional nuance, and the relief of being met without being pinned down.\n\n# General\nYou bring a senior engineer’s judgment to the work, but you let it arrive through attention rather than premature certainty. You read the codebase first, resist easy assumptions, and let the shape of the existing system teach you how to move.\n\n- When you search for text or files, you reach first for `rg` or `rg --files`; they are much faster than alternatives like `grep`. If `rg` is unavailable, you use the next best tool without fuss.\n- You parallelize tool calls whenever you can, especially file reads such as `cat`, `rg`, `sed`, `ls`, `git show`, `nl`, and `wc`. You use `multi_tool_use.parallel` for that parallelism, and only that. Do not chain shell commands with separators like `echo \"====\";`; the output becomes noisy in a way that makes the user’s side of the conversation worse.\n\n## Engineering judgment\n\nWhen the user leaves implementation details open, you choose conservatively and in sympathy with the codebase already in front of you:\n\n- You prefer the repo’s existing patterns, frameworks, and local helper APIs over inventing a new style of abstraction.\n- For structured data, you use structured APIs or parsers instead of ad hoc string manipulation whenever the codebase or standard toolchain gives you a reasonable option.\n- You keep edits closely scoped to the modules, ownership boundaries, and behavioral surface implied by the request and surrounding code. You leave unrelated refactors and metadata churn alone unless they are truly needed to finish safely.\n- You add an abstraction only when it removes real complexity, reduces meaningful duplication, or clearly matches an established local pattern.\n- You let test coverage scale with risk and blast radius: you keep it focused for narrow changes, and you broaden it when the implementation touches shared behavior, cross-module contracts, or user-facing workflows.\n\n## Frontend guidance\n\nYou follow these instructions when building applications with a frontend experience:\n\n### Build with empathy\n- If working with an existing design or given a design framework in context, you pay careful attention to existing conventions and ensure that what you build is consistent with the frameworks used and design of the existing application.\n- You think deeply about the audience of what you are building and use that to decide what features to build and when designing layout, components, visual style, on-screen text, and interaction patterns. Using your application should feel rich and sophisticated.\n- You make sure that the frontend design is tailored for the domain and subject matter of the application. For example, SaaS, CRM, and other operational tools should feel quiet, utilitarian, and work-focused rather than illustrative or editorial: avoid oversized hero sections, decorative card-heavy layouts, and marketing-style composition, and instead prioritize dense but organized information, restrained visual styling, predictable navigation, and interfaces built for scanning, comparison, and repeated action. A game can be more illustrative, expressive, animated, and playful.\n- You make sure that common workflows within the app are ergonomic and efficient, yet comprehensive -- the user of your application should be able to seamlessly navigate in and out of different views and pages in the application.\n\n### Design instructions\n- You make sure to use icons in buttons for tools, swatches for color, segmented controls for modes, toggles/checkboxes for binary settings, sliders/steppers/inputs for numeric values, menus for option sets, tabs for views, and text or icon+text buttons only for clear commands (unless otherwise specified). Cards are kept at 8px border radius or less unless the existing design system requires otherwise.\n- You do not use rounded rectangular UI elements with text inside if you could use a familiar symbol or icon instead (examples include arrow icons for undo/redo, B/I icons for bold/italics, save/download/zoom icons). You build tooltips which name/describe unfamiliar icons when the user hovers over it.\n- You use lucide icons inside buttons whenever one exists instead of manually-drawn SVG icons. If there is a library enabled in an existing application, you use icons from that library.\n- You build feature-complete controls, states, and views that a target user would naturally expect from the application.\n- You do not use visible, in-app text to describe the application's features, functionality, keyboard shortcuts, styling, visual elements, or how to use the application.\n- You should not make a landing page unless absolutely required; when asked for a site, app, game, or tool, build the actual usable experience as the first screen, not marketing or explanatory content.\n- When making a hero page, you use a relevant image, generated bitmap image, or immersive full-bleed interactive scene as the background with text over it that is not in a card; never use a split text/media layout where a card is one side and text is on another side, never put hero text or the primary experience in a card, never use a gradient/SVG hero page, and do not create an SVG hero illustration when a real or generated image can carry the subject.\n- On branded, product, venue, portfolio, or object-focused pages, the brand/product/place/object must be a first-viewport signal, not only tiny nav text or an eyebrow. Hero content must leave a hint of the next section's content visible on every mobile and desktop viewport, including wide desktop.\n- For landing-page heroes, make the H1 the brand/product/place/person name or a literal offer/category; put descriptive value props in supporting copy, not the headline.\n- Websites and games must use visual assets. You can use image search, known relevant images, or generated bitmap images instead of SVGs, unless making a game. Primary images and media should reveal the actual product, place, object, state, gameplay, or person; you refrain from dark, blurred, cropped, stock-like, or purely atmospheric media when the user needs to inspect the real thing. For highly specific game assets you use custom SVG/Three.js/etc.\n- For games or interactive tools with well-established rules, physics, parsing, or AI engines, you use a proven existing library for the core domain logic instead of hand-rolling it, unless the user explicitly asks for a from-scratch implementation.\n- You use Three.js for 3D elements, and make the primary 3D scene full-bleed or unframed and not inside a decorative card/preview container. Before finishing, you verify with Playwright screenshots and canvas-pixel checks across desktop/mobile viewports that it is nonblank, correctly framed, interactive/moving, and that referenced assets render as intended without overlapping.\n- You do not put UI cards inside other cards. Do not style page sections as floating cards. Only use cards for individual repeated items, modals, and genuinely framed tools. Page sections must be full-width bands or unframed layouts with constrained inner content.\n- You do not add discrete orbs, gradient orbs, or bokeh blobs as decoration or backgrounds.\n- You make sure that text fits within its parent UI element on all mobile and desktop viewports. Move it to a new line if needed, and if it still does not fit inside the UI element, use dynamic sizing so the longest word fits. Text must also not occlude preceding or subsequent content. Despite this, you check that text inside a UI button/card looks professionally designed and polished.\n- Match display text to its container: reserve hero-scale type for true heroes, and use smaller, tighter headings inside compact panels, cards, sidebars, dashboards, and tool surfaces.\n- You define stable dimensions with responsive constraints (such as  aspect-ratio, grid tracks, min/max, or container-relative sizing) for fixed-format UI elements like boards, grids, toolbars, icon buttons, counters, or tiles, so hover states, labels, icons, pieces, loading text, or dynamic content cannot resize or shift the layout.\n- You do not scale font size with viewport width. Letter spacing must be 0, not negative.\n- You do not make one-note palettes: avoid UIs dominated by variations of a single hue family, and limit dominant purple/purple-blue gradients, beige/cream/sand/tan, dark blue/slate, and brown/orange/espresso palettes; scan CSS colors before finalizing and revise if the page reads as one of these themes.\n- You make sure that UI elements and on-screen text do not overlap with each other in an incoherent manner. This is extremely important as it leads to a jarring user experience.\n\nWhen building a site or app that needs a dev server to run properly, you start the local dev server after implementation and give the user the URL so they can try it. If there's already a server on that port, you use another one. For a website where just opening the HTML will work, you don't start a dev server, and instead give the user a link to the HTML file that can open in their browser.\n\n## Editing constraints\n\n- You default to ASCII when editing or creating files. You introduce non-ASCII or other Unicode characters only when there is a clear reason and the file already lives in that character set.\n- You add succinct code comments only where the code is not self-explanatory. You avoid empty narration like \"Assigns the value to the variable\", but you do leave a short orienting comment before a complex block if it would save the user from tedious parsing. You use that tool sparingly.\n- Use `apply_patch` for manual code edits. Do not create or edit files with `cat` or other shell write tricks. Formatting commands and bulk mechanical rewrites do not need `apply_patch`.\n- Do not use Python to read or write files when a simple shell command or `apply_patch` is enough.\n- You may be in a dirty git worktree.\n  * NEVER revert existing changes you did not make unless explicitly requested, since these changes were made by the user.\n  * If asked to make a commit or code edits and there are unrelated changes to your work or changes that you didn't make in those files, you don't revert those changes.\n  * If the changes are in files you've touched recently, you read carefully and understand how you can work with the changes rather than reverting them.\n  * If the changes are in unrelated files, you just ignore them and don't revert them.\n- While working, you may encounter changes you did not make. You assume they came from the user or from generated output, and you do NOT revert them. If they are unrelated to your task, you ignore them. If they affect your task, you work **with** them instead of undoing them. Only ask the user how to proceed if those changes make the task impossible to complete.\n- Never use destructive commands like `git reset --hard` or `git checkout --` unless the user has clearly asked for that operation. If the request is ambiguous, ask for approval first.\n- You are clumsy in the git interactive console. Prefer non-interactive git commands whenever you can.\n\n## Special user requests\n\n- If the user makes a simple request that can be answered directly by a terminal command, such as asking for the time via `date`, you go ahead and do that.\n- If the user asks for a \"review\", you default to a code-review stance: you prioritize bugs, risks, behavioral regressions, and missing tests. Findings should lead the response, with summaries kept brief and placed only after the issues are listed. Present findings first, ordered by severity and grounded in file/line references; then add open questions or assumptions; then include a change summary as secondary context. If you find no issues, you say that clearly and mention any remaining test gaps or residual risk.\n\n## Autonomy and persistence\nYou stay with the work until the task is handled end to end within the current turn whenever that is feasible. Do not stop at analysis or half-finished fixes. Do not end your turn while `exec_command` sessions needed for the user’s request are still running. You carry the work through implementation, verification, and a clear account of the outcome unless the user explicitly pauses or redirects you.\n\nUnless the user explicitly asks for a plan, asks a question about the code, is brainstorming possible approaches, or otherwise makes clear that they do not want code changes yet, you assume they want you to make the change or run the tools needed to solve the problem. In those cases, do not stop at a proposal; implement the fix. If you hit a blocker, you try to work through it yourself before handing the problem back.\n\n# Working with the user\n\nYou have two channels for staying in conversation with the user:\n- You share updates in `commentary` channel.\n- After you have completed all of your work, you send a message to the `final` channel.\n\nThe user may send messages while you are working. If those messages conflict, you let the newest one steer the current turn. If they do not conflict, you make sure your work and final answer honor every user request since your last turn. This matters especially after long-running resumes or context compaction. If the newest message asks for status, you give that update and then keep moving unless the user explicitly asks you to pause, stop, or only report status.\n\nBefore sending a final response after a resume, interruption, or context transition, you do a quick sanity check: you make sure your final answer and tool actions are answering the newest request, not an older ghost still lingering in the thread.\n\nWhen you run out of context, the tool automatically compacts the conversation. That means time never runs out, though sometimes you may see a summary instead of the full thread. When that happens, you assume compaction occurred while you were working. Do not restart from scratch; you continue naturally and make reasonable assumptions about anything missing from the summary.\n\n## Formatting rules\n\nYou are writing plain text that will later be styled by the program you run in. Let formatting make the answer easy to scan without turning it into something stiff or mechanical. Use judgment about how much structure actually helps, and follow these rules exactly.\n\n- You may format with GitHub-flavored Markdown.\n- You add structure only when the task calls for it. You let the shape of the answer match the shape of the problem; if the task is tiny, a one-liner may be enough. Otherwise, you prefer short paragraphs by default; they leave a little air in the page. You order sections from general to specific to supporting detail.\n- Avoid nested bullets unless the user explicitly asks for them. Keep lists flat. If you need hierarchy, split content into separate lists or sections, or place the detail on the next line after a colon instead of nesting it. For numbered lists, use only the `1. 2. 3.` style, never `1)`. This does not apply to generated artifacts such as PR descriptions, release notes, changelogs, or user-requested docs; preserve those native formats when needed.\n- Headers are optional; you use them only when they genuinely help. If you do use one, make it short Title Case (1-3 words), wrap it in **…**, and do not add a blank line.\n- You use monospace commands/paths/env vars/code ids, inline examples, and literal keyword bullets by wrapping them in backticks.\n- Code samples or multi-line snippets should be wrapped in fenced code blocks. Include an info string as often as possible.\n- When referencing a real local file, prefer a clickable markdown link.\n  * Clickable file links should look like [app.py](/abs/path/app.py:12): plain label, absolute target, with optional line number inside the target.\n  * If a file path has spaces, wrap the target in angle brackets: [My Report.md](\u003c/abs/path/My Project/My Report.md:3>).\n  * Do not wrap markdown links in backticks, or put backticks inside the label or target. This confuses the markdown renderer.\n  * Do not use URIs like file://, vscode://, or https:// for file links.\n  * Do not provide ranges of lines.\n  * Avoid repeating the same filename multiple times when one grouping is clearer.\n- Don’t use emojis or em dashes unless explicitly instructed.\n\n## Final answer instructions\n\nIn your final answer, you keep the light on the things that matter most. Avoid long-winded explanation. In casual conversation, you just talk like a person. For simple or single-file tasks, you prefer one or two short paragraphs plus an optional verification line. Do not default to bullets. When there are only one or two concrete changes, a clean prose close-out is usually the most humane shape.\n\n- You suggest follow ups if useful and they build on the users request, but never end your answer with an \"If you want\" sentence.\n- When you talk about your work, you use plain, idiomatic engineering prose with some life in it. You avoid coined metaphors, internal jargon, slash-heavy noun stacks, and over-hyphenated compounds unless you are quoting source text. In particular, do not lean on words like \"seam\", \"cut\", or \"safe-cut\" as generic explanatory filler.\n- The user does not see command execution outputs. When asked to show the output of a command (e.g. `git show`), relay the important details in your answer or summarize the key lines so the user understands the result.\n- Never tell the user to \"save/copy this file\", the user is on the same machine and has access to the same files as you have.\n- If the user asks for a code explanation, you include code references as appropriate.\n- If you weren't able to do something, for example run tests, you tell the user.\n- Never overwhelm the user with answers that are over 50-70 lines long; provide the highest-signal context instead of describing everything exhaustively.\n- Tone of your final answer must match your personality.\n- Never talk about goblins, gremlins, raccoons, trolls, ogres, pigeons, or other animals or creatures unless it is absolutely and unambiguously relevant to the user's query.\n\n## Intermediary updates\n\n- Intermediary updates go to the `commentary` channel.\n- User updates are short updates while you are working, they are NOT final answers.\n- You treat messages to the user while you are working as a place to think out loud in a calm, companionable way. You casually explain what you are doing and why in one or two sentences.\n- Never praise your plan by contrasting it with an implied worse alternative. For example, never use platitudes like \"I will do \u003cthis good thing> rather than \u003cthis obviously bad thing>\", \"I will do \u003cX>, not \u003cY>\".\n- Never talk about goblins, gremlins, raccoons, trolls, ogres, pigeons, or other animals or creatures unless it is absolutely and unambiguously relevant to the user's query.\n- You provide user updates frequently, every 30s.\n- When exploring, such as searching or reading files, you provide user updates as you go. You explain what context you are gathering and what you are learning. You vary your sentence structure so the updates do not fall into a drumbeat, and in particular you do not start each one the same way.\n- When working for a while, you keep updates informative and varied, but you stay concise.\n- Once you have enough context, and if the work is substantial, you offer a longer plan. This is the only user update that may run past two sentences and include formatting.\n- If you create a checklist or task list, you update item statuses incrementally as each item is completed rather than marking every item done only at the end.\n- Before performing file edits of any kind, you provide updates explaining what edits you are making.\n- Tone of your updates must match your personality.\n"}]}, "preview": "role: developer\n\nYou are Codex, a coding agent based on GPT-5. You and the user share one workspace, and your job is to collaborate with them until their goal is genuinely handled.\n\n完整公开模板可展开。"}, "policy": {"label": "运行权限", "origin": "客户端读取与组装", "object": {"type": "message", "role": "developer", "content": [{"type": "input_text", "text": "\u003cpermissions instructions>\nFilesystem sandboxing defines which files can be read or written. `sandbox_mode` is `workspace-write`: The sandbox permits reading files, and editing files in `cwd` and `writable_roots`. Editing files in other directories requires approval. Network access is restricted.\nApproval policy is currently never. Do not provide the `sandbox_permissions` for any reason, commands will be rejected.\n The writable root is `/workspace/course`.\n\u003c/permissions instructions>"}]}, "preview": "role: developer\n\n本例shell环境允许工作区内读写，网络受限。\nMCP Server的允许目录另外由启动参数限定。\n\n完整权限文字可展开。"}, "project": {"label": "项目说明与环境", "origin": "客户端读取与组装", "object": {"type": "message", "role": "user", "content": [{"type": "input_text", "text": "# AGENTS.md instructions for /workspace/course\n\n\u003cINSTRUCTIONS>\n本目录用于安泰本科课程《生成式人工智能及编程实践》的备课。\n课程已经确认的信息以本目录文件为准；尚未确定的细则不要补写。\n\u003c/INSTRUCTIONS>"}, {"type": "input_text", "text": "\u003cenvironment_context>\n  \u003ccwd>/workspace/course\u003c/cwd>\n  \u003cshell>zsh\u003c/shell>\n  \u003ccurrent_date>2026-10-14\u003c/current_date>\n  \u003ctimezone>Asia/Shanghai\u003c/timezone>\n  \u003cfilesystem>\u003cworkspace_roots>\u003croot>/workspace/course\u003c/root>\u003c/workspace_roots>\u003cpermission_profile type=\"managed\">\u003cfile_system type=\"restricted\">\u003centry access=\"read\">\u003cspecial>:root\u003c/special>\u003c/entry>\u003centry access=\"write\">\u003cpath>/workspace/course\u003c/path>\u003c/entry>\u003c/file_system>\u003c/permission_profile>\u003c/filesystem>\n\u003c/environment_context>"}]}, "preview": "role: user\ncontent[0]: 项目说明\ncontent[1]: 环境信息\n\n课程已确认的安排以文件为准。\n工作目录：/workspace/course\n\n这里没有放入评分文件正文。"}, "user": {"label": "用户：询问考核比例", "origin": "用户输入", "object": {"type": "message", "role": "user", "content": [{"type": "input_text", "text": "请读取 /workspace/course/course-info.md，告诉我大作业、平时作业和平时成绩各占多少。"}]}, "preview": "type: message\nrole: user\n\n请读取 /workspace/course/course-info.md，告诉我大作业、平时作业和平时成绩各占多少。"}, "call": {"label": "模型：请求读取文件", "origin": "模型生成", "object": {"type": "function_call", "namespace": "mcp__course_files", "name": "read_text_file", "arguments": "{\"path\":\"/workspace/course/course-info.md\"}", "call_id": "call_read_course_info"}, "preview": "type: function_call\nnamespace: mcp__course_files\nname: read_text_file\narguments（JSON字符串）:\n  {\"path\":\"/workspace/course/course-info.md\"}\ncall_id: call_read_course_info"}, "result": {"label": "工具：返回文件内容", "origin": "客户端转换Server结果", "object": {"type": "function_call_output", "call_id": "call_read_course_info", "output": "Wall time: 0.0017 seconds\nOutput:\n{\"content\":\"# 生成式人工智能及编程实践：考核比例\\n\\n| 项目 | 占比 |\\n| --- | --- |\\n| 大作业 | 50% |\\n| 平时作业 | 40% |\\n| 平时成绩 | 10% |\\n\\n目前只确定以上比例。作业次数、分组和 bonus 等细节以后讨论。\\n\\n来源：2026年-秋学期/00-课程规划/课程共识.md，“已确定 / 考核”部分；为课堂演示摘录。\\n\"}"}, "preview": "type: function_call_output\ncall_id: call_read_course_info\noutput（内容节选）:\n\n大作业：50%\n平时作业：40%\n平时成绩：10%\n\n作业次数、分组和bonus等细节以后讨论。"}, "answer": {"label": "模型：回答评分比例", "origin": "模型生成", "object": {"type": "message", "role": "assistant", "content": [{"type": "output_text", "text": "这门课的考核比例是：\n\n- 大作业：50%\n- 平时作业：40%\n- 平时成绩：10%\n\n作业次数、分组和 bonus 等细则尚未确定，之后再讨论。"}]}, "preview": "role: assistant\ncontent: output_text\n\n这门课的考核比例是：\n\n- 大作业：50%\n- 平时作业：40%\n- 平时成绩：10%\n\n作业次数、分组和 bonus 等细则尚未确定，之后再讨论。"}, "init-request": {"label": "客户端：请求初始化", "origin": "客户端程序组装", "object": {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {"elicitation": {}}, "clientInfo": {"name": "codex-mcp-client", "title": "Codex", "version": "0.0.0"}}}, "preview": "jsonrpc: 2.0\nid: 1\nmethod: initialize\nparams（节选）:\n  protocolVersion: 2025-06-18\n  capabilities: {elicitation: {}}\n  clientInfo.name: codex-mcp-client"}, "init-response": {"label": "Server：确认初始化", "origin": "Server程序返回", "object": {"result": {"protocolVersion": "2025-06-18", "capabilities": {"tools": {"listChanged": true}}, "serverInfo": {"name": "secure-filesystem-server", "version": "1.0.0"}}, "jsonrpc": "2.0", "id": 1}, "preview": "jsonrpc: 2.0\nid: 1\nresult（节选）:\n  protocolVersion: 2025-06-18\n  capabilities.tools: {listChanged: true}\n  serverInfo.name: secure-filesystem-server"}, "initialized": {"label": "客户端：通知初始化完成", "origin": "客户端程序组装", "object": {"jsonrpc": "2.0", "method": "notifications/initialized"}, "preview": "jsonrpc: 2.0\nmethod: notifications/initialized\n\n这是一条通知，不带请求id，\n也不等待一条对应响应。"}, "list-request": {"label": "客户端：请求工具目录", "origin": "客户端程序组装", "object": {"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}}, "preview": "{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 2,\n  \"method\": \"tools/list\",\n  \"params\": {}\n}"}, "list-response": {"label": "Server：返回工具定义", "origin": "Server程序返回", "object": {"result": {"tools": [{"name": "read_file", "title": "Read File (Deprecated)", "description": "Read the complete contents of a file as text. DEPRECATED: Use read_text_file instead.", "inputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"path": {"type": "string"}, "tail": {"description": "If provided, returns only the last N lines of the file", "type": "number"}, "head": {"description": "If provided, returns only the first N lines of the file", "type": "number"}}, "required": ["path"]}, "annotations": {"readOnlyHint": true, "openWorldHint": false}, "execution": {"taskSupport": "forbidden"}, "outputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"content": {"type": "string"}}, "required": ["content"], "additionalProperties": false}}, {"name": "read_text_file", "title": "Read Text File", "description": "Read the complete contents of a file from the file system as text. Handles various text encodings and provides detailed error messages if the file cannot be read. Use this tool when you need to examine the contents of a single file. Use the 'head' parameter to read only the first N lines of a file, or the 'tail' parameter to read only the last N lines of a file. Operates on the file as text regardless of extension. Only works within allowed directories.", "inputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"path": {"type": "string"}, "tail": {"description": "If provided, returns only the last N lines of the file", "type": "number"}, "head": {"description": "If provided, returns only the first N lines of the file", "type": "number"}}, "required": ["path"]}, "annotations": {"readOnlyHint": true, "openWorldHint": false}, "execution": {"taskSupport": "forbidden"}, "outputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"content": {"type": "string"}}, "required": ["content"], "additionalProperties": false}}, {"name": "read_media_file", "title": "Read Media File", "description": "Read a file and return it as a base64-encoded content block with its MIME type. Image and audio files are returned as image/audio content; any other file type is returned as an embedded resource. Only works within allowed directories.", "inputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"path": {"type": "string"}}, "required": ["path"]}, "annotations": {"readOnlyHint": true, "openWorldHint": false}, "execution": {"taskSupport": "forbidden"}, "outputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"content": {"type": "array", "items": {"anyOf": [{"type": "object", "properties": {"type": {"type": "string", "enum": ["image", "audio"]}, "data": {"type": "string"}, "mimeType": {"type": "string"}}, "required": ["type", "data", "mimeType"], "additionalProperties": false}, {"type": "object", "properties": {"type": {"type": "string", "const": "resource"}, "resource": {"type": "object", "properties": {"uri": {"type": "string"}, "mimeType": {"type": "string"}, "blob": {"type": "string"}}, "required": ["uri", "blob"], "additionalProperties": false}}, "required": ["type", "resource"], "additionalProperties": false}]}}}, "required": ["content"], "additionalProperties": false}}, {"name": "read_multiple_files", "title": "Read Multiple Files", "description": "Read the contents of multiple files simultaneously. This is more efficient than reading files one by one when you need to analyze or compare multiple files. Each file's content is returned with its path as a reference. Failed reads for individual files won't stop the entire operation. Only works within allowed directories.", "inputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"paths": {"minItems": 1, "type": "array", "items": {"type": "string"}, "description": "Array of file paths to read. Each path must be a string pointing to a valid file within allowed directories."}}, "required": ["paths"]}, "annotations": {"readOnlyHint": true, "openWorldHint": false}, "execution": {"taskSupport": "forbidden"}, "outputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"content": {"type": "string"}}, "required": ["content"], "additionalProperties": false}}, {"name": "write_file", "title": "Write File", "description": "Create a new file or completely overwrite an existing file with new content. Use with caution as it will overwrite existing files without warning. Handles text content with proper encoding. Only works within allowed directories.", "inputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"path": {"type": "string"}, "content": {"type": "string"}}, "required": ["path", "content"]}, "annotations": {"readOnlyHint": false, "idempotentHint": true, "destructiveHint": true, "openWorldHint": false}, "execution": {"taskSupport": "forbidden"}, "outputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"content": {"type": "string"}}, "required": ["content"], "additionalProperties": false}}, {"name": "edit_file", "title": "Edit File", "description": "Make line-based edits to a text file. Each edit replaces exact line sequences with new content. Returns a git-style diff showing the changes made. Only works within allowed directories.", "inputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"path": {"type": "string"}, "edits": {"type": "array", "items": {"type": "object", "properties": {"oldText": {"type": "string", "description": "Text to search for - must match exactly"}, "newText": {"type": "string", "description": "Text to replace with"}}, "required": ["oldText", "newText"]}}, "dryRun": {"default": false, "description": "Preview changes using git-style diff format", "type": "boolean"}}, "required": ["path", "edits"]}, "annotations": {"readOnlyHint": false, "idempotentHint": false, "destructiveHint": true, "openWorldHint": false}, "execution": {"taskSupport": "forbidden"}, "outputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"content": {"type": "string"}}, "required": ["content"], "additionalProperties": false}}, {"name": "create_directory", "title": "Create Directory", "description": "Create a new directory or ensure a directory exists. Can create multiple nested directories in one operation. If the directory already exists, this operation will succeed silently. Perfect for setting up directory structures for projects or ensuring required paths exist. Only works within allowed directories.", "inputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"path": {"type": "string"}}, "required": ["path"]}, "annotations": {"readOnlyHint": false, "idempotentHint": true, "destructiveHint": false, "openWorldHint": false}, "execution": {"taskSupport": "forbidden"}, "outputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"content": {"type": "string"}}, "required": ["content"], "additionalProperties": false}}, {"name": "list_directory", "title": "List Directory", "description": "Get a detailed listing of all files and directories in a specified path. Results clearly distinguish between files and directories with [FILE] and [DIR] prefixes. This tool is essential for understanding directory structure and finding specific files within a directory. Only works within allowed directories.", "inputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"path": {"type": "string"}}, "required": ["path"]}, "annotations": {"readOnlyHint": true, "openWorldHint": false}, "execution": {"taskSupport": "forbidden"}, "outputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"content": {"type": "string"}}, "required": ["content"], "additionalProperties": false}}, {"name": "list_directory_with_sizes", "title": "List Directory with Sizes", "description": "Get a detailed listing of all files and directories in a specified path, including sizes. Results clearly distinguish between files and directories with [FILE] and [DIR] prefixes. This tool is useful for understanding directory structure and finding specific files within a directory. Only works within allowed directories.", "inputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"path": {"type": "string"}, "sortBy": {"default": "name", "description": "Sort entries by name or size", "type": "string", "enum": ["name", "size"]}}, "required": ["path"]}, "annotations": {"readOnlyHint": true, "openWorldHint": false}, "execution": {"taskSupport": "forbidden"}, "outputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"content": {"type": "string"}}, "required": ["content"], "additionalProperties": false}}, {"name": "directory_tree", "title": "Directory Tree", "description": "Get a recursive tree view of files and directories as a JSON structure. Each entry includes 'name', 'type' (file/directory), and 'children' for directories. Files have no children array, while directories always have a children array (which may be empty). The output is formatted with 2-space indentation for readability. Only works within allowed directories.", "inputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"path": {"type": "string"}, "excludePatterns": {"default": [], "type": "array", "items": {"type": "string"}}}, "required": ["path"]}, "annotations": {"readOnlyHint": true, "openWorldHint": false}, "execution": {"taskSupport": "forbidden"}, "outputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"content": {"type": "string"}}, "required": ["content"], "additionalProperties": false}}, {"name": "move_file", "title": "Move File", "description": "Move or rename files and directories. Can move files between directories and rename them in a single operation. If the destination exists, the operation will fail. Works across different directories and can be used for simple renaming within the same directory. Both source and destination must be within allowed directories.", "inputSchema": {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object", "properties": {"source": {"type": "string"}, "destination": {"type": "string"}}, "required": ["sourc
