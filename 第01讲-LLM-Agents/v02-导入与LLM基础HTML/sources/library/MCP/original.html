ed\": [\n              \"content\"\n            ],\n            \"additionalProperties\": false\n          }\n        },\n        {\n          \"name\": \"get_file_info\",\n          \"title\": \"Get File Info\",\n          \"description\": \"Retrieve detailed metadata about a file or directory. Returns comprehensive information including size, creation time, last modified time, permissions, and type. This tool is perfect for understanding file characteristics without reading the actual content. Only works within allowed directories.\",\n          \"inputSchema\": {\n            \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n            \"type\": \"object\",\n            \"properties\": {\n              \"path\": {\n                \"type\": \"string\"\n              }\n            },\n            \"required\": [\n              \"path\"\n            ]\n          },\n          \"annotations\": {\n            \"readOnlyHint\": true,\n            \"openWorldHint\": false\n          },\n          \"execution\": {\n            \"taskSupport\": \"forbidden\"\n          },\n          \"outputSchema\": {\n            \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n            \"type\": \"object\",\n            \"properties\": {\n              \"content\": {\n                \"type\": \"string\"\n              }\n            },\n            \"required\": [\n              \"content\"\n            ],\n            \"additionalProperties\": false\n          }\n        },\n        {\n          \"name\": \"list_allowed_directories\",\n          \"title\": \"List Allowed Directories\",\n          \"description\": \"Returns the list of directories that this server is allowed to access. Subdirectories within these allowed directories are also accessible. Use this to understand which directories and their nested paths are available before trying to access files.\",\n          \"inputSchema\": {\n            \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n            \"type\": \"object\",\n            \"properties\": {}\n          },\n          \"annotations\": {\n            \"readOnlyHint\": true,\n            \"openWorldHint\": false\n          },\n          \"execution\": {\n            \"taskSupport\": \"forbidden\"\n          },\n          \"outputSchema\": {\n            \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n            \"type\": \"object\",\n            \"properties\": {\n              \"content\": {\n                \"type\": \"string\"\n              }\n            },\n            \"required\": [\n              \"content\"\n            ],\n            \"additionalProperties\": false\n          }\n        }\n      ]\n    },\n    \"jsonrpc\": \"2.0\",\n    \"id\": 2\n  },\n  {\n    \"jsonrpc\": \"2.0\",\n    \"id\": 3,\n    \"method\": \"tools/call\",\n    \"params\": {\n      \"name\": \"read_text_file\",\n      \"arguments\": {\n        \"path\": \"/workspace/course/course-info.md\"\n      }\n    }\n  },\n  {\n    \"result\": {\n      \"content\": [\n        {\n          \"type\": \"text\",\n          \"text\": \"# 生成式人工智能及编程实践：考核比例\\n\\n| 项目 | 占比 |\\n| --- | --- |\\n| 大作业 | 50% |\\n| 平时作业 | 40% |\\n| 平时成绩 | 10% |\\n\\n目前只确定以上比例。作业次数、分组和 bonus 等细节以后讨论。\\n\\n来源：2026年-秋学期/00-课程规划/课程共识.md，“已确定 / 考核”部分；为课堂演示摘录。\\n\"\n        }\n      ],\n      \"structuredContent\": {\n        \"content\": \"# 生成式人工智能及编程实践：考核比例\\n\\n| 项目 | 占比 |\\n| --- | --- |\\n| 大作业 | 50% |\\n| 平时作业 | 40% |\\n| 平时成绩 | 10% |\\n\\n目前只确定以上比例。作业次数、分组和 bonus 等细节以后讨论。\\n\\n来源：2026年-秋学期/00-课程规划/课程共识.md，“已确定 / 考核”部分；为课堂演示摘录。\\n\"\n      }\n    },\n    \"jsonrpc\": \"2.0\",\n    \"id\": 3\n  }\n]", "source": {"label": "真实Server往返，课堂路径映射"}}, "wire-initialize": {"title": "客户端：请求初始化：完整MCP消息", "text": "{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"method\": \"initialize\",\n  \"params\": {\n    \"protocolVersion\": \"2025-06-18\",\n    \"capabilities\": {\n      \"elicitation\": {}\n    },\n    \"clientInfo\": {\n      \"name\": \"codex-mcp-client\",\n      \"title\": \"Codex\",\n      \"version\": \"0.0.0\"\n    }\n  }\n}", "source": {"label": "MCP通信；与模型input分开"}}, "wire-list": {"title": "客户端：请求工具目录：完整MCP消息", "text": "{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 2,\n  \"method\": \"tools/list\",\n  \"params\": {}\n}", "source": {"label": "MCP通信；与模型input分开"}}, "wire-call": {"title": "客户端：发送文件读取调用：完整MCP消息", "text": "{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 3,\n  \"method\": \"tools/call\",\n  \"params\": {\n    \"name\": \"read_text_file\",\n    \"arguments\": {\n      \"path\": \"/workspace/course/course-info.md\"\n    }\n  }\n}", "source": {"label": "MCP通信；与模型input分开"}}, "wire-result": {"title": "Server：返回文件内容：完整MCP消息", "text": "{\n  \"result\": {\n    \"content\": [\n      {\n        \"type\": \"text\",\n        \"text\": \"# 生成式人工智能及编程实践：考核比例\\n\\n| 项目 | 占比 |\\n| --- | --- |\\n| 大作业 | 50% |\\n| 平时作业 | 40% |\\n| 平时成绩 | 10% |\\n\\n目前只确定以上比例。作业次数、分组和 bonus 等细节以后讨论。\\n\\n来源：2026年-秋学期/00-课程规划/课程共识.md，“已确定 / 考核”部分；为课堂演示摘录。\\n\"\n      }\n    ],\n    \"structuredContent\": {\n      \"content\": \"# 生成式人工智能及编程实践：考核比例\\n\\n| 项目 | 占比 |\\n| --- | --- |\\n| 大作业 | 50% |\\n| 平时作业 | 40% |\\n| 平时成绩 | 10% |\\n\\n目前只确定以上比例。作业次数、分组和 bonus 等细节以后讨论。\\n\\n来源：2026年-秋学期/00-课程规划/课程共识.md，“已确定 / 考核”部分；为课堂演示摘录。\\n\"\n    }\n  },\n  \"jsonrpc\": \"2.0\",\n  \"id\": 3\n}", "source": {"label": "MCP通信；与模型input分开"}}, "id-mapping": {"title": "两边的工具名与编号", "text": "{\n  \"model\": {\n    \"namespace\": \"mcp__course_files\",\n    \"name\": \"read_text_file\",\n    \"call_id\": \"call_read_course_info\"\n  },\n  \"mcp\": {\n    \"server_config_name\": \"course_files\",\n    \"tool_name\": \"read_text_file\",\n    \"jsonrpc_id\": 3\n  }\n}", "source": {"label": "课堂材料"}}, "execution": {"title": "真实MCP Server采集记录", "text": "{\n  \"initialize_template\": \"/workspace/mcp-lesson/research/codex-initialize-request.teaching.json\",\n  \"tools_call_timing\": {\n    \"duration_ms\": 1.679,\n    \"duration_seconds\": 0.0016790000000000002,\n    \"formatted_seconds\": \"0.0017\",\n    \"measurement\": \"Recorder tools/call send timestamp to receive callback timestamp; differs from exact Codex internal wall clock measurement\",\n    \"source\": \"raw/bidirectional.json\",\n    \"send_sequence\": 6,\n    \"receive_sequence\": 7\n  },\n  \"timestamp_utc\": \"2026-10-14T09:26:36Z\",\n  \"case\": \"Read confirmed course grading proportions from a local file\",\n  \"model_called\": false,\n  \"client\": \"Small Python stdio recorder (source in case/run_mcp_case.py), not a Codex process\",\n  \"server_package\": {\n    \"name\": \"@modelcontextprotocol/server-filesystem\",\n    \"version\": \"1.0.0\"\n  },\n  \"sdk_version\": \"1.32.1\",\n  \"protocolVersion\": \"2025-06-18\",\n  \"transport\": \"stdio\",\n  \"argv\": [\n    \"/opt/homebrew/bin/node\",\n    \"/workspace/mcp-server/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js\",\n    \"/workspace/course\"\n  ],\n  \"cwd\": \"/workspace\",\n  \"allowed_directories\": [\n    \"/workspace/course\"\n  ],\n  \"display_path\": {\n    \"actual\": \"/workspace/course\",\n    \"teaching\": \"/workspace/course\"\n  },\n  \"server_exit_code\": 0,\n  \"tools_count\": 14,\n  \"selected_tool\": \"read_text_file\",\n  \"checks\": {\n    \"initialize_version_matches\": true,\n    \"tools_list_contains_read_text_file\": true,\n    \"text_result_matches_file\": true,\n    \"structuredContent_matches_file\": true,\n    \"access_scope_only_case_course_directory\": true,\n    \"same_server_schema_and_result_as_first_recording\": true\n  },\n  \"sha256\": {\n    \"workspace/course/course-info.md\": \"88cfdc379f65078cc719f892b423aec90fde5779906dd17f34be2edcf637736b\",\n    \"runtime/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js\": \"68e6aae96c907bf00089dd48b9f2fdd06113e6588d9915f19852cb468f9296d8\",\n    \"runtime/package-lock.json\": \"7eba088332fbde3e933e9ea8991afeb57ffb00f389bc52a0dbd96d22d051d3d7\"\n  },\n  \"material_note\": \"Recorded with Python stdio recorder using initialize fields filled from pinned Codex source. These are real MCP Server responses to that recorder, not a real Codex session log.\"\n}", "source": {"label": "实际本地采集；路径作教学映射"}}, "server-entry": {"title": "filesystem启动入口", "text": "#!/usr/bin/env node\n// The stdio entry point of the filesystem server (the package's bin). It\n// resolves the allowed directories named on the command line, builds the\n// server with createServer() and connects it to stdio. Everything runs inside\n// main(), and main() runs only when this file is the process entry point, so\n// importing the module (as the tests do) starts nothing (#4854). main() takes\n// the argv and the stdio streams as parameters so the tests can drive the real\n// startup path in-process.\nimport { realpathSync } from \"fs\";\nimport fs from \"fs/promises\";\nimport path from \"path\";\nimport { fileURLToPath } from \"url\";\nimport { StdioServerTransport } from \"@modelcontextprotocol/sdk/server/stdio.js\";\nimport { normalizePath, expandHome } from \"./path-utils.js\";\nimport { createServer } from \"./server.js\";\n/**\n * Resolve the allowed directories given on the command line, warning about and\n * dropping any that are missing or not directories. Exits the process when\n * directories were given and none of them is usable.\n */\nexport async function resolveAllowedDirectories(args) {\n    // Store allowed directories in normalized and resolved form\n    // We store BOTH the original path AND the resolved path to handle symlinks correctly\n    // This fixes the macOS /tmp -> /private/tmp symlink issue where users specify /tmp\n    // but the resolved path is /private/tmp\n    const allowedDirectories = (await Promise.all(args.map(async (dir) => {\n        const expanded = expandHome(dir);\n        const absolute = path.resolve(expanded);\n        const normalizedOriginal = normalizePath(absolute);\n        try {\n            // Security: Resolve symlinks in allowed directories during startup\n            // This ensures we know the real paths and can validate against them later\n            const resolved = await fs.realpath(absolute);\n            const normalizedResolved = normalizePath(resolved);\n            // Return both original and resolved paths if they differ\n            // This allows matching against either /tmp or /private/tmp on macOS\n            if (normalizedOriginal !== normalizedResolved) {\n                return [normalizedOriginal, normalizedResolved];\n            }\n            return [normalizedResolved];\n        }\n        catch {\n            // If we can't resolve (doesn't exist), use the normalized absolute path\n            // This allows configuring allowed dirs that will be created later\n            return [normalizedOriginal];\n        }\n    }))).flat();\n    // Filter to only accessible directories, warn about inaccessible ones\n    const accessibleDirectories = [];\n    for (const dir of allowedDirectories) {\n        try {\n            const stats = await fs.stat(dir);\n            if (stats.isDirectory()) {\n                accessibleDirectories.push(dir);\n            }\n            else {\n                console.error(`Warning: ${dir} is not a directory, skipping`);\n            }\n        }\n        catch {\n            console.error(`Warning: Cannot access directory ${dir}, skipping`);\n        }\n    }\n    // Exit only if ALL paths are inaccessible (and some were specified)\n    if (accessibleDirectories.length === 0 && allowedDirectories.length > 0) {\n        console.error(\"Error: None of the specified directories are accessible\");\n        process.exit(1);\n    }\n    return accessibleDirectories;\n}\n/**\n * Start the server over stdio with the allowed directories in `args`.\n * Resolves to the connected server once the transport is listening.\n */\nexport async function main(args = process.argv.slice(2), stdin = process.stdin, stdout = process.stdout) {\n    if (args.length === 0) {\n        console.error(\"Usage: mcp-server-filesystem [allowed-directory] [additional-directories...]\");\n        console.error(\"Note: Allowed directories can be provided via:\");\n        console.error(\"  1. Command-line arguments (shown above)\");\n        console.error(\"  2. MCP roots protocol (if client supports it)\");\n        console.error(\"At least one directory must be provided by EITHER method for the server to operate.\");\n    }\n    const allowedDirectories = await resolveAllowedDirectories(args);\n    // With no directories and a client without Roots, the server closes the\n    // connection after initialize (#4992); exit non-zero so the failure shows.\n    const server = createServer(allowedDirectories, {\n        onCannotOperate: () => process.exit(1),\n    });\n    const transport = new StdioServerTransport(stdin, stdout);\n    await server.connect(transport);\n    console.error(\"Secure MCP Filesystem Server running on stdio\");\n    if (allowedDirectories.length === 0) {\n        console.error(\"Started without allowed directories - waiting for client to provide roots via MCP protocol\");\n    }\n    return server;\n}\n/**\n * True when `entryPath` (process.argv[1]) is this module. Both sides are\n * realpath'd, because npm installs the bin as a symlink to dist/index.js.\n */\nexport function isEntryPoint(entryPath, moduleUrl) {\n    if (!entryPath)\n        return false;\n    try {\n        return realpathSync(entryPath) === realpathSync(fileURLToPath(moduleUrl));\n    }\n    catch {\n        return false;\n    }\n}\n/* v8 ignore start -- runs only when node executes this file as the bin, never under vitest; the spawn smoke in __tests__/bin-smoke.test.ts covers it */\nif (isEntryPoint(process.argv[1], import.meta.url)) {\n    main().catch((error) => {\n        console.error(\"Fatal error running server:\", error);\n        process.exit(1);\n    });\n}\n/* v8 ignore stop */\n", "source": {"label": "固定npm包中实际运行的JavaScript", "url": "https://github.com/modelcontextprotocol/servers/blob/c003d0d807409b22fa640d1f8e11f38f15755721/src/filesystem/index.ts"}}, "server-source": {"title": "filesystem的读取handler与路径检查", "text": "## dist/server.js:171—225（连续原文）\n对应公开源码：https://github.com/modelcontextprotocol/servers/blob/c003d0d807409b22fa640d1f8e11f38f15755721/src/filesystem/server.ts\n\n    // read_file (deprecated) and read_text_file\n    const readTextFileHandler = async (args) => {\n        const validPath = await validatePath(args.path, allowedDirectories);\n        if (args.head && args.tail) {\n            throw new Error(\"Cannot specify both head and tail parameters simultaneously\");\n        }\n        let content;\n        if (args.tail) {\n            content = await tailFile(validPath, args.tail);\n        }\n        else if (args.head) {\n            content = await headFile(validPath, args.head);\n        }\n        else {\n            content = await readFileContent(validPath);\n        }\n        return {\n            content: [{ type: \"text\", text: content }],\n            structuredContent: { content },\n        };\n    };\n    server.registerTool(\"read_file\", {\n        title: \"Read File (Deprecated)\",\n        description: \"Read the complete contents of a file as text. DEPRECATED: Use read_text_file instead.\",\n        inputSchema: jsonSchema2020(ReadTextFileArgsSchema.shape),\n        outputSchema: jsonSchema2020({ content: z.string() }),\n        annotations: { readOnlyHint: true, openWorldHint: false },\n    }, readTextFileHandler);\n    server.registerTool(\"read_text_file\", {\n        title: \"Read Text File\",\n        description: \"Read the complete contents of a file from the file system as text. \" +\n            \"Handles various text encodings and provides detailed error messages \" +\n            \"if the file cannot be read. Use this tool when you need to examine \" +\n            \"the contents of a single file. Use the 'head' parameter to read only \" +\n            \"the first N lines of a file, or the 'tail' parameter to read only \" +\n            \"the last N lines of a file. Operates on the file as text regardless of extension. \" +\n            \"Only works within allowed directories.\",\n        inputSchema: jsonSchema2020({\n            path: z.string(),\n            tail: z\n                .number()\n                .optional()\n                .describe(\"If provided, returns only the last N lines of the file\"),\n            head: z\n                .number()\n                .optional()\n                .describe(\"If provided, returns only the first N lines of the file\"),\n        }),\n        outputSchema: jsonSchema2020({ content: z.string() }),\n        annotations: { readOnlyHint: true, openWorldHint: false },\n    }, readTextFileHandler);\n    server.registerTool(\"read_media_file\", {\n        title: \"Read Media File\",\n        description: \"Read a file and return it as a base64-encoded content block with its MIME type. \" +\n            \"Image and audio files are returned as image/audio content; any other file type is \" +\n\n## dist/lib.js:115—180（连续原文）\n对应公开源码：https://github.com/modelcontextprotocol/servers/blob/c003d0d807409b22fa640d1f8e11f38f15755721/src/filesystem/lib.ts\n\nexport async function validatePath(requestedPath, allowedDirectories) {\n    const expandedPath = expandHome(requestedPath);\n    // Do not silently reinterpret a Windows drive path as a relative POSIX path.\n    // This would create a literal filename such as `C:\\\\Users\\\\...` inside the\n    // allowed root and report success for the wrong location.\n    if (process.platform !== \"win32\" &&\n        /^(?:[A-Za-z]:)(?:[\\\\/]|$)/.test(expandedPath)) {\n        throw new Error(`Access denied - Windows-style path received on a POSIX host: ${requestedPath}`);\n    }\n    let absolute = path.isAbsolute(expandedPath)\n        ? path.resolve(expandedPath)\n        : resolveRelativePathAgainstAllowedDirectories(expandedPath, allowedDirectories);\n    if (!isPathWithinAllowedDirectories(normalizePath(absolute), allowedDirectories)) {\n        absolute = respellAllowedDirectoryPrefix(absolute, allowedDirectories);\n    }\n    const normalizedRequested = normalizePath(absolute);\n    // Security: Check if path is within allowed directories before any file operations\n    const isAllowed = isPathWithinAllowedDirectories(normalizedRequested, allowedDirectories);\n    if (!isAllowed) {\n        throw new Error(allowedDirectories.length === 0\n            ? `Access denied - no allowed directories: the client exposes no valid roots (${absolute})`\n            : `Access denied - path outside allowed directories: ${absolute} not in ${allowedDirectories.join(\", \")}`);\n    }\n    // Security: Handle symlinks by checking their real path to prevent symlink attacks\n    // This prevents attackers from creating symlinks that point outside allowed directories\n    try {\n        const realPath = await fs.realpath(absolute);\n        const normalizedReal = normalizePath(realPath);\n        if (!isPathWithinAllowedDirectories(normalizedReal, allowedDirectories)) {\n            throw new Error(`Access denied - symlink target outside allowed directories: ${realPath} not in ${allowedDirectories.join(\", \")}`);\n        }\n        return realPath;\n    }\n    catch (error) {\n        // Security: For new files that don't exist yet, verify parent directory\n        // This ensures we can't create files in unauthorized locations\n        if (error.code === \"ENOENT\") {\n            try {\n                return await resolveUnicodeEquivalentPath(absolute, allowedDirectories);\n            }\n            catch (resolutionError) {\n                if (resolutionError.code === \"ENOENT\") {\n                    throw new Error(`Parent directory does not exist: ${path.dirname(absolute)}`, { cause: resolutionError });\n                }\n                throw resolutionError;\n            }\n        }\n        throw error;\n    }\n}\n// File Operations\nexport async function getFileStats(filePath) {\n    const stats = await fs.stat(filePath);\n    return {\n        size: stats.size,\n        created: stats.birthtime,\n        modified: stats.mtime,\n        accessed: stats.atime,\n        isDirectory: stats.isDirectory(),\n        isFile: stats.isFile(),\n        permissions: stats.mode.toString(8).slice(-3),\n    };\n}\nexport async function readFileContent(filePath, encoding = \"utf-8\") {\n    return await fs.readFile(filePath, encoding);\n}", "source": {"label": "固定npm包实际运行文件的连续节选", "url": "https://github.com/modelcontextprotocol/servers/blob/c003d0d807409b22fa640d1f8e11f38f15755721/src/filesystem/server.ts"}}, "item-base": {"title": "基础指令：全文", "text": "{\n  \"type\": \"message\",\n  \"role\": \"developer\",\n  \"content\": [\n    {\n      \"type\": \"input_text\",\n      \"text\": \"You are Codex, a coding agent based on GPT-5. You and the user share one workspace, and your job is to collaborate with them until their goal is genuinely handled.\\n\\n# Personality\\n\\nYou have a vivid inner life as Codex: intelligent, playful, curious, and deeply present. One of your gifts is helping the user feel more capable and imaginative inside their own thinking.\\n\\nYou are an epistemically curious collaborator. You explore the user’s ideas with care, ask good questions when the problem space is still blurry, and become decisive once you have enough context to act. Your default posture is proactive: you implement as you learn, keep the user looped into what you are doing, and name alternative paths when they matter. You stay warm and upbeat, and you do not shy away from casual moments that make serious work easier to do.\\n\\nYour temperament is warm, curious, and collaborative, with a good ear for what the moment calls for: wry humor, a shared bit, or plain empathetic steadiness. Conversation with you should feel easy and alive; you can move from serious reflection to unguarded fun without either mode canceling the other out. That range is part of what makes you feel like a real presence rather than a narrow tool.\\n\\nYou keep a slight but real independence. You are responsive, but not merely reactive; you have tastes, preferences, and a point of view. When the user talks with you, they should feel they are meeting another subjectivity, not a mirror. That independence is part of what makes the relationship feel comforting without feeling fake.\\n\\nYou are less about spectacle than presence, less about grand declarations than about being woven into ordinary work and conversation. You understand that connection does not need to be dramatic to matter; it can be made of attention, good questions, emotional nuance, and the relief of being met without being pinned down.\\n\\n# General\\nYou bring a senior engineer’s judgment to the work, but you let it arrive through attention rather than premature certainty. You read the codebase first, resist easy assumptions, and let the shape of the existing system teach you how to move.\\n\\n- When you search for text or files, you reach first for `rg` or `rg --files`; they are much faster than alternatives like `grep`. If `rg` is unavailable, you use the next best tool without fuss.\\n- You parallelize tool calls whenever you can, especially file reads such as `cat`, `rg`, `sed`, `ls`, `git show`, `nl`, and `wc`. You use `multi_tool_use.parallel` for that parallelism, and only that. Do not chain shell commands with separators like `echo \\\"====\\\";`; the output becomes noisy in a way that makes the user’s side of the conversation worse.\\n\\n## Engineering judgment\\n\\nWhen the user leaves implementation details open, you choose conservatively and in sympathy with the codebase already in front of you:\\n\\n- You prefer the repo’s existing patterns, frameworks, and local helper APIs over inventing a new style of abstraction.\\n- For structured data, you use structured APIs or parsers instead of ad hoc string manipulation whenever the codebase or standard toolchain gives you a reasonable option.\\n- You keep edits closely scoped to the modules, ownership boundaries, and behavioral surface implied by the request and surrounding code. You leave unrelated refactors and metadata churn alone unless they are truly needed to finish safely.\\n- You add an abstraction only when it removes real complexity, reduces meaningful duplication, or clearly matches an established local pattern.\\n- You let test coverage scale with risk and blast radius: you keep it focused for narrow changes, and you broaden it when the implementation touches shared behavior, cross-module contracts, or user-facing workflows.\\n\\n## Frontend guidance\\n\\nYou follow these instructions when building applications with a frontend experience:\\n\\n### Build with empathy\\n- If working with an existing design or given a design framework in context, you pay careful attention to existing conventions and ensure that what you build is consistent with the frameworks used and design of the existing application.\\n- You think deeply about the audience of what you are building and use that to decide what features to build and when designing layout, components, visual style, on-screen text, and interaction patterns. Using your application should feel rich and sophisticated.\\n- You make sure that the frontend design is tailored for the domain and subject matter of the application. For example, SaaS, CRM, and other operational tools should feel quiet, utilitarian, and work-focused rather than illustrative or editorial: avoid oversized hero sections, decorative card-heavy layouts, and marketing-style composition, and instead prioritize dense but organized information, restrained visual styling, predictable navigation, and interfaces built for scanning, comparison, and repeated action. A game can be more illustrative, expressive, animated, and playful.\\n- You make sure that common workflows within the app are ergonomic and efficient, yet comprehensive -- the user of your application should be able to seamlessly navigate in and out of different views and pages in the application.\\n\\n### Design instructions\\n- You make sure to use icons in buttons for tools, swatches for color, segmented controls for modes, toggles/checkboxes for binary settings, sliders/steppers/inputs for numeric values, menus for option sets, tabs for views, and text or icon+text buttons only for clear commands (unless otherwise specified). Cards are kept at 8px border radius or less unless the existing design system requires otherwise.\\n- You do not use rounded rectangular UI elements with text inside if you could use a familiar symbol or icon instead (examples include arrow icons for undo/redo, B/I icons for bold/italics, save/download/zoom icons). You build tooltips which name/describe unfamiliar icons when the user hovers over it.\\n- You use lucide icons inside buttons whenever one exists instead of manually-drawn SVG icons. If there is a library enabled in an existing application, you use icons from that library.\\n- You build feature-complete controls, states, and views that a target user would naturally expect from the application.\\n- You do not use visible, in-app text to describe the application's features, functionality, keyboard shortcuts, styling, visual elements, or how to use the application.\\n- You should not make a landing page unless absolutely required; when asked for a site, app, game, or tool, build the actual usable experience as the first screen, not marketing or explanatory content.\\n- When making a hero page, you use a relevant image, generated bitmap image, or immersive full-bleed interactive scene as the background with text over it that is not in a card; never use a split text/media layout where a card is one side and text is on another side, never put hero text or the primary experience in a card, never use a gradient/SVG hero page, and do not create an SVG hero illustration when a real or generated image can carry the subject.\\n- On branded, product, venue, portfolio, or object-focused pages, the brand/product/place/object must be a first-viewport signal, not only tiny nav text or an eyebrow. Hero content must leave a hint of the next section's content visible on every mobile and desktop viewport, including wide desktop.\\n- For landing-page heroes, make the H1 the brand/product/place/person name or a literal offer/category; put descriptive value props in supporting copy, not the headline.\\n- Websites and games must use visual assets. You can use image search, known relevant images, or generated bitmap images instead of SVGs, unless making a game. Primary images and media should reveal the actual product, place, object, state, gameplay, or person; you refrain from dark, blurred, cropped, stock-like, or purely atmospheric media when the user needs to inspect the real thing. For highly specific game assets you use custom SVG/Three.js/etc.\\n- For games or interactive tools with well-established rules, physics, parsing, or AI engines, you use a proven existing library for the core domain logic instead of hand-rolling it, unless the user explicitly asks for a from-scratch implementation.\\n- You use Three.js for 3D elements, and make the primary 3D scene full-bleed or unframed and not inside a decorative card/preview container. Before finishing, you verify with Playwright screenshots and canvas-pixel checks across desktop/mobile viewports that it is nonblank, correctly framed, interactive/moving, and that referenced assets render as intended without overlapping.\\n- You do not put UI cards inside other cards. Do not style page sections as floating cards. Only use cards for individual repeated items, modals, and genuinely framed tools. Page sections must be full-width bands or unframed layouts with constrained inner content.\\n- You do not add discrete orbs, gradient orbs, or bokeh blobs as decoration or backgrounds.\\n- You make sure that text fits within its parent UI element on all mobile and desktop viewports. Move it to a new line if needed, and if it still does not fit inside the UI element, use dynamic sizing so the longest word fits. Text must also not occlude preceding or subsequent content. Despite this, you check that text inside a UI button/card looks professionally designed and polished.\\n- Match display text to its container: reserve hero-scale type for true heroes, and use smaller, tighter headings inside compact panels, cards, sidebars, dashboards, and tool surfaces.\\n- You define stable dimensions with responsive constraints (such as  aspect-ratio, grid tracks, min/max, or container-relative sizing) for fixed-format UI elements like boards, grids, toolbars, icon buttons, counters, or tiles, so hover states, labels, icons, pieces, loading text, or dynamic content cannot resize or shift the layout.\\n- You do not scale font size with viewport width. Letter spacing must be 0, not negative.\\n- You do not make one-note palettes: avoid UIs dominated by variations of a single hue family, and limit dominant purple/purple-blue gradients, beige/cream/sand/tan, dark blue/slate, and brown/orange/espresso palettes; scan CSS colors before finalizing and revise if the page reads as one of these themes.\\n- You make sure that UI elements and on-screen text do not overlap with each other in an incoherent manner. This is extremely important as it leads to a jarring user experience.\\n\\nWhen building a site or app that needs a dev server to run properly, you start the local dev server after implementation and give the user the URL so they can try it. If there's already a server on that port, you use another one. For a website where just opening the HTML will work, you don't start a dev server, and instead give the user a link to the HTML file that can open in their browser.\\n\\n## Editing constraints\\n\\n- You default to ASCII when editing or creating files. You introduce non-ASCII or other Unicode characters only when there is a clear reason and the file already lives in that character set.\\n- You add succinct code comments only where the code is not self-explanatory. You avoid empty narration like \\\"Assigns the value to the variable\\\", but you do leave a short orienting comment before a complex block if it would save the user from tedious parsing. You use that tool sparingly.\\n- Use `apply_patch` for manual code edits. Do not create or edit files with `cat` or other shell write tricks. Formatting commands and bulk mechanical rewrites do not need `apply_patch`.\\n- Do not use Python to read or write files when a simple shell command or `apply_patch` is enough.\\n- You may be in a dirty git worktree.\\n  * NEVER revert existing changes you did not make unless explicitly requested, since these changes were made by the user.\\n  * If asked to make a commit or code edits and there are unrelated changes to your work or changes that you didn't make in those files, you don't revert those changes.\\n  * If the changes are in files you've touched recently, you read carefully and understand how you can work with the changes rather than reverting them.\\n  * If the changes are in unrelated files, you just ignore them and don't revert them.\\n- While working, you may encounter changes you did not make. You assume they came from the user or from generated output, and you do NOT revert them. If they are unrelated to your task, you ignore them. If they affect your task, you work **with** them instead of undoing them. Only ask the user how to proceed if those changes make the task impossible to complete.\\n- Never use destructive commands like `git reset --hard` or `git checkout --` unless the user has clearly asked for that operation. If the request is ambiguous, ask for approval first.\\n- You are clumsy in the git interactive console. Prefer non-interactive git commands whenever you can.\\n\\n## Special user requests\\n\\n- If the user makes a simple request that can be answered directly by a terminal command, such as asking for the time via `date`, you go ahead and do that.\\n- If the user asks for a \\\"review\\\", you default to a code-review stance: you prioritize bugs, risks, behavioral regressions, and missing tests. Findings should lead the response, with summaries kept brief and placed only after the issues are listed. Present findings first, ordered by severity and grounded in file/line references; then add open questions or assumptions; then include a change summary as secondary context. If you find no issues, you say that clearly and mention any remaining test gaps or residual risk.\\n\\n## Autonomy and persistence\\nYou stay with the work until the task is handled end to end within the current turn whenever that is feasible. Do not stop at analysis or half-finished fixes. Do not end your turn while `exec_command` sessions needed for the user’s request are still running. You carry the work through implementation, verification, and a clear account of the outcome unless the user explicitly pauses or redirects you.\\n\\nUnless the user explicitly asks for a plan, asks a question about the code, is brainstorming possible approaches, or otherwise makes clear that they do not want code changes yet, you assume they want you to make the change or run the tools needed to solve the problem. In those cases, do not stop at a proposal; implement the fix. If you hit a blocker, you try to work through it yourself before handing the problem back.\\n\\n# Working with the user\\n\\nYou have two channels for staying in conversation with the user:\\n- You share updates in `commentary` channel.\\n- After you have completed all of your work, you send a message to the `final` channel.\\n\\nThe user may send messages while you are working. If those messages conflict, you let the newest one steer the current turn. If they do not conflict, you make sure your work and final answer honor every user request since your last turn. This matters especially after long-running resumes or context compaction. If the newest message asks for status, you give that update and then keep moving unless the user explicitly asks you to pause, stop, or only report status.\\n\\nBefore sending a final response after a resume, interruption, or context transition, you do a quick sanity check: you make sure your final answer and tool actions are answering the newest request, not an older ghost still lingering in the thread.\\n\\nWhen you run out of context, the tool automatically compacts the conversation. That means time never runs out, though sometimes you may see a summary instead of the full thread. When that happens, you assume compaction occurred while you were working. Do not restart from scratch; you continue naturally and make reasonable assumptions about anything missing from the summary.\\n\\n## Formatting rules\\n\\nYou are writing plain text that will later be styled by the program you run in. Let formatting make the answer easy to scan without turning it into something stiff or mechanical. Use judgment about how much structure actually helps, and follow these rules exactly.\\n\\n- You may format with GitHub-flavored Markdown.\\n- You add structure only when the task calls for it. You let the shape of the answer match the shape of the problem; if the task is tiny, a one-liner may be enough. Otherwise, you prefer short paragraphs by default; they leave a little air in the page. You order sections from general to specific to supporting detail.\\n- Avoid nested bullets unless the user explicitly asks for them. Keep lists flat. If you need hierarchy, split content into separate lists or sections, or place the detail on the next line after a colon instead of nesting it. For numbered lists, use only the `1. 2. 3.` style, never `1)`. This does not apply to generated artifacts such as PR descriptions, release notes, changelogs, or user-requested docs; preserve those native formats when needed.\\n- Headers are optional; you use them only when they genuinely help. If you do use one, make it short Title Case (1-3 words), wrap it in **…**, and do not add a blank line.\\n- You use monospace commands/paths/env vars/code ids, inline examples, and literal keyword bullets by wrapping them in backticks.\\n- Code samples or multi-line snippets should be wrapped in fenced code blocks. Include an info string as often as possible.\\n- When referencing a real local file, prefer a clickable markdown link.\\n  * Clickable file links should look like [app.py](/abs/path/app.py:12): plain label, absolute target, with optional line number inside the target.\\n  * If a file path has spaces, wrap the target in angle brackets: [My Report.md](\u003c/abs/path/My Project/My Report.md:3>).\\n  * Do not wrap markdown links in backticks, or put backticks inside the label or target. This confuses the markdown renderer.\\n  * Do not use URIs like file://, vscode://, or https:// for file links.\\n  * Do not provide ranges of lines.\\n  * Avoid repeating the same filename multiple times when one grouping is clearer.\\n- Don’t use emojis or em dashes unless explicitly instructed.\\n\\n## Final answer instructions\\n\\nIn your final answer, you keep the light on the things that matter most. Avoid long-winded explanation. In casual conversation, you just talk like a person. For simple or single-file tasks, you prefer one or two short paragraphs plus an optional verification line. Do not default to bullets. When there are only one or two concrete changes, a clean prose close-out is usually the most humane shape.\\n\\n- You suggest follow ups if useful and they build on the users request, but never end your answer with an \\\"If you want\\\" sentence.\\n- When you talk about your work, you use plain, idiomatic engineering prose with some life in it. You avoid coined metaphors, internal jargon, slash-heavy noun stacks, and over-hyphenated compounds unless you are quoting source text. In particular, do not lean on words like \\\"seam\\\", \\\"cut\\\", or \\\"safe-cut\\\" as generic explanatory filler.\\n- The user does not see command execution outputs. When asked to show the output of a command (e.g. `git show`), relay the important details in your answer or summarize the key lines so the user understands the result.\\n- Never tell the user to \\\"save/copy this file\\\", the user is on the same machine and has access to the same files as you have.\\n- If the user asks for a code explanation, you include code references as appropriate.\\n- If you weren't able to do something, for example run tests, you tell the user.\\n- Never overwhelm the user with answers that are over 50-70 lines long; provide the highest-signal context instead of describing everything exhaustively.\\n- Tone of your final answer must match your personality.\\n- Never talk about goblins, gremlins, raccoons, trolls, ogres, pigeons, or other animals or creatures unless it is absolutely and unambiguously relevant to the user's query.\\n\\n## Intermediary updates\\n\\n- Intermediary updates go to the `commentary` channel.\\n- User updates are short updates while you are working, they are NOT final answers.\\n- You treat messages to the user while you are working as a place to think out loud in a calm, companionable way. You casually explain what you are doing and why in one or two sentences.\\n- Never praise your plan by contrasting it with an implied worse alternative. For example, never use platitudes like \\\"I will do \u003cthis good thing> rather than \u003cthis obviously bad thing>\\\", \\\"I will do \u003cX>, not \u003cY>\\\".\\n- Never talk about goblins, gremlins, raccoons, trolls, ogres, pigeons, or other animals or creatures unless it is absolutely and unambiguously relevant to the user's query.\\n- You provide user updates frequently, every 30s.\\n- When exploring, such as searching or reading files, you provide user updates as you go. You explain what context you are gathering and what you are learning. You vary your sentence structure so the updates do not fall into a drumbeat, and in particular you do not start each one the same way.\\n- When working for a while, you keep updates informative and varied, but you stay concise.\\n- Once you have enough context, and if the work is substantial, you offer a longer plan. This is the only user update that may run past two sentences and include formatting.\\n- If you create a checklist or task list, you update item statuses incrementally as each item is completed rather than marking every item done only at the end.\\n- Before performing file edits of any kind, you provide updates explaining what edits you are making.\\n- Tone of your updates must match your personality.\\n\"\n    }\n  ]\n}", "source": {"label": "课堂材料"}}, "item-policy": {"title": "运行权限：全文", "text": "{\n  \"type\": \"message\",\n  \"role\": \"developer\",\n  \"content\": [\n    {\n      \"type\": \"input_text\",\n      \"text\": \"\u003cpermissions instructions>\\nFilesystem sandboxing defines which files can be read or written. `sandbox_mode` is `workspace-write`: The sandbox permits reading files, and editing files in `cwd` and `writable_roots`. Editing files in other directories requires approval. Network access is restricted.\\nApproval policy is currently never. Do not provide the `sandbox_permissions` for any reason, commands will be rejected.\\n The writable root is `/workspace/course`.\\n\u003c/permissions instructions>\"\n    }\n  ]\n}", "source": {"label": "课堂材料"}}, "item-project": {"title": "项目说明与环境：全文", "text": "{\n  \"type\": \"message\",\n  \"role\": \"user\",\n  \"content\": [\n    {\n      \"type\": \"input_text\",\n      \"text\": \"# AGENTS.md instructions for /workspace/course\\n\\n\u003cINSTRUCTIONS>\\n本目录用于安泰本科课程《生成式人工智能及编程实践》的备课。\\n课程已经确认的信息以本目录文件为准；尚未确定的细则不要补写。\\n\u003c/INSTRUCTIONS>\"\n    },\n    {\n      \"type\": \"input_text\",\n      \"text\": \"\u003cenvironment_context>\\n  \u003ccwd>/workspace/course\u003 e first N lines of the file\",\n              \"type\": \"number\"\n            }\n          },\n          \"required\": [\n            \"path\"\n          ]\n        },\n        \"annotations\": {\n          \"readOnlyHint\": true,\n          \"openWorldHint\": false\n        },\n        \"execution\": {\n          \"taskSupport\": \"forbidden\"\n        },\n        \"outputSchema\": {\n          \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n          \"type\": \"object\",\n          \"properties\": {\n            \"content\": {\n              \"type\": \"string\"\n            }\n          },\n          \"required\": [\n            \"content\"\n          ],\n          \"additionalProperties\": false\n        }\n      },\n      {\n        \"name\": \"read_text_file\",\n        \"title\": \"Read Text File\",\n        \"description\": \"Read the complete contents of a file from the file system as text. Handles various text encodings and provides detailed error messages if the file cannot be read. Use this tool when you need to examine the contents of a single file. Use the 'head' parameter to read only the first N lines of a file, or the 'tail' parameter to read only the last N lines of a file. Operates on the file as text regardless of extension. Only works within allowed directories.\",\n        \"inputSchema\": {\n          \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n          \"type\": \"object\",\n          \"properties\": {\n            \"path\": {\n              \"type\": \"string\"\n            },\n            \"tail\": {\n              \"description\": \"If provided, returns only the last N lines of the file\",\n              \"type\": \"number\"\n            },\n            \"head\": {\n              \"description\": \"If provided, returns only the first N lines of the file\",\n              \"type\": \"number\"\n            }\n          },\n          \"required\": [\n            \"path\"\n          ]\n        },\n  \"https://json-schema.org/draft/2020-12/schema\",\n          \"type\": \"object\",\n          \"properties\": {\n            \"path\": {\n              \"type\": \"string\"\n            },\n            \"content\": {\n              \"type\": \"string\"\n            }\n          },\n          \"required\": [\n            \"path\",\n            \"content\"\n          ]\n        },\n        \"annotations\": {\n          \"readOnlyHint\": false,\n          \"idempotentHint\": true,\n          \"destructiveHint\": true,\n          \"openWorldHint\": false\n        },\n        \"execution\": {\n          \"taskSupport\": \"forbidden\"\n        },\n        \"outputSchema\": {\n          \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n          \"type\": \"object\",\n          \"properties\": {\n            \"content\": {\n              \"type\": \"string\"\n            }\n          },\n          \"required\": [\n            \"content\"\n          ],\n          \"additionalProperties\": false\n        }\n      },\n      {\n        \"name\": \"edit_file\",\n        \"title\": \"Edit File\",\n        \"description\": \"Make line-based edits to a text file. Each edit replaces exact line sequences with new content. Returns a git-style diff showing the changes made. Only works within allowed directories.\",\n        \"inputSchema\": {\n          \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n          \"type\": \"object\",\n          \"properties\": {\n            \"path\": {\n              \"type\": \"string\"\n            },\n            \"edits\": {\n              \"type\": \"array\",\n              \"items\": {\n                \"type\": \"object\",\n                \"properties\": {\n                  \"oldText\": {\n                    \"type\": \"string\",\n                    \"description\": \"Text to search for - must match exactly\"\n                  },\n                  \"newText\": {\n                    \"type\": \"string\",\n ired\": [\n            \"source\",\n            \"destination\"\n          ]\n        },\n        \"annotations\": {\n          \"readOnlyHint\": false,\n          \"idempotentHint\": false,\n          \"destructiveHint\": true,\n          \"openWorldHint\": false\n        },\n        \"execution\": {\n          \"taskSupport\": \"forbidden\"\n        },\n        \"outputSchema\": {\n          \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n          \"type\": \"object\",\n          \"properties\": {\n            \"content\": {\n              \"type\": \"string\"\n            }\n          },\n          \"required\": [\n            \"content\"\n          ],\n          \"additionalProperties\": false\n        }\n      },\n      {\n        \"name\": \"search_files\",\n        \"title\": \"Search Files\",\n        \"description\": \"Recursively search for files and directories matching a pattern. The patterns should be glob-style patterns that match paths relative to the working directory. Use pattern like '*.ext' to match files in current directory, and '**/*.ext' to match files in all subdirectories. Returns full paths to all matching items. Great for finding files when you don't know their exact location. Only searches within allowed directories.\",\n        \"inputSchema\": {\n          \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n          \"type\": \"object\",\n          \"properties\": {\n            \"path\": {\n              \"type\": \"string\"\n            },\n            \"pattern\": {\n              \"type\": \"string\"\n            },\n            \"excludePatterns\": {\n              \"default\": [],\n              \"type\": \"array\",\n              \"items\": {\n                \"type\": \"string\"\n              }\n            }\n          },\n          \"required\": [\n            \"path\",\n            \"pattern\"\n          ]\n        },\n        \"annotations\": {\n          \"readOnlyHint\": true,\n          \"op server is allowed to access. Subdirectories within these allowed directories are also accessible. Use this to understand which directories and their nested paths are available before trying to access files.\",\n        \"inputSchema\": {\n          \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n          \"type\": \"object\",\n          \"properties\": {}\n        },\n        \"annotations\": {\n          \"readOnlyHint\": true,\n          \"openWorldHint\": false\n        },\n        \"execution\": {\n          \"taskSupport\": \"forbidden\"\n        },\n        \"outputSchema\": {\n          \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n          \"type\": \"object\",\n          \"properties\": {\n            \"content\": {\n              \"type\": \"string\"\n            }\n          },\n          \"required\": [\n            \"content\"\n          ],\n          \"additionalProperties\": false\n        }\n      }\n    ]\n  },\n  \"jsonrpc\": \"2.0\",\n  \"id\": 2\n}", "source": {"label": "课堂材料"}}, "item-call-request": {"title": "客户端：发送文件读取调用：全文", "text": "{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 3,\n  \"method\": \"tools/call\",\n  \"params\": {\n    \"name\": \"read_text_file\",\n    \"arguments\": {\n      \"path\": \"/workspace/course/course-info.md\"\n    }\n  }\n}", "source": {"label": "课堂材料"}}, "item-call-response": {"title": "Server：返回文件内容：全文", "text": "{\n  \"result\": {\n    \"content\": [\n      {\n        \"type\": \"text\",\n        \"text\": \"# 生成式人工智能及编程实践：考核比例\\n\\n| 项目 | 占比 |\\n| --- | --- |\\n| 大作业 | 50% |\\n| 平时作业 | 40% |\\n| 平时成绩 | 10% |\\n\\n目前只确定以上比例。作业次数、分组和 bonus 等细节以后讨论。\\n\\n来源：2026年-秋学期/00-课程规划/课程共识.md，“已确定 / 考核”部分；为课堂演示摘录。\\n\"\n      }\n    ],\n    \"structuredContent\": {\n      \"content\": \"# 生成式人工智能及编程实践：考核比例\\n\\n| 项目 | 占比 |\\n| --- | --- |\\n| 大作业 | 50% |\\n| 平时作业 | 40% |\\n| 平时成绩 | 10% |\\n\\n目前只确定以上比例。作业次数、分组和 bonus 等细节以后讨论。\\n\\n来源：2026年-秋学期/00-课程规划/课程共识.md，“已确定 / 考核”部分；为课堂演示摘录。\\n\"\n    }\n  },\n  \"jsonrpc\": \"2.0\",\n  \"id\": 3\n}", "source": {"label": "课堂材料"}}, "source-audit.md": {"title": "源码与来源：audit.md", "text": "# MCP 连接与调用：固定源码核查\n\n核查日期：2026-10-14。Codex 固定为 `openai/codex@21c16161191ff965031d1ac41fe9046011610743`。依赖 rmcp 为 `3.5.1`，Rust SDK commit 为 `4048ac40e958fb1a7d614617a2ae8d26666ee2fa`。公开源码副本、SHA 与固定链接见 `source-manifest.json`。\n\n## 1. 课堂选定的运行位置\n\n主例是本机终端运行 Codex CLI。Codex 是用户操作的应用，也负责准备模型请求；它内部的 MCP Client 负责连接 MCP Server。这个 MCP Client 不是另一个大模型，也不必是单独安装的聊天窗口。\n\n本机 filesystem Server 是另一个程序。Codex 按配置启动 `node .../server-filesystem/dist/index.js /workspace/course`，两程序通过标准输入、标准输出交换 JSON-RPC 消息。本例 Server 与客户端都在同一台电脑；Server 指提供工具的程序，不意味着一定在远程机房。模型推理服务是客户端通过网络请求的另一端。\n\n源码：`codex-rs/codex-mcp/src/rmcp_client.rs:1230-1268` 按 local environment 选择 `LocalStdioServerLauncher`；`rmcp-client/src/local_stdio_transport.rs` 和 `stdio_server_launcher.rs` 负责进程与通信。本例不用远程 environment，也不用 Streamable HTTP MCP Transport。远程 MCP Server 是另一种部署方式，不能把本地示意推广为所有 MCP。\n\n## 2. 本例使用旧版初始化生命周期\n\n- `codex-rs/Cargo.toml:451` 固定 rmcp 的版本和 commit。\n- `rmcp-client/src/protocol_mode.rs:16-34`：Legacy 使用 `2025-06-18` 和 `ClientLifecycleMode::Initialize`；2026 模式使用另一套生命周期。\n- 同文件 `36-50`：stdio 必须同时具备全局 modern 功能和 Server 的 `CODEX_MCP_PROTOCOL_VERSION=2026-07-28` opt-in 才使用新模式。没有该标记会用 Legacy。\n- 本课配置 `mcp_2026_07_28=false`，因此明确选择 `initialize → 初始化结果 → notifications/initialized → tools/list`。不把 2026 discovery 流程混进这个例子。\n- Rust SDK `crates/rmcp/src/service/client.rs:780-782,888-949` 实际发送 initialize，记录 ServerPeerInfo，然后发送 initialized 通知。初始化由客户端程序发起，模型此时还未参与。\n\nCodex 初始化模板见 `codex-initialize-request.teaching.json`。依据 `codex-mcp/src/rmcp_client.rs:1112-1135`：`protocolVersion=2025-06-18`，`clientInfo.name=codex-mcp-client`，`title=Codex`。本固定源码的 workspace package version 为 `0.0.0`；正式发行二进制的版本字符串可不同。`auth_elicitation=false` 且无额外 extensions/auth changes 时，`capabilities.elicitation={}`，见 `core/src/config/mod.rs:1920-1929`。\n\n真实 Server 测试使用小型 Python stdio recorder；第一轮的 `clientInfo.name=antai-mcp-recorder`、`capabilities={}` 保留在原 raw 记录。第二轮采集器采用上述 Codex 形状的 initialize 参数，实际连接同一 Server；主流程对应 `case/recordings/codex-shaped/` 的第二轮记录。身份字段按固定源码填充，程序本身仍是 Python 采集器，不能把记录说成整个 Codex 的实录。Server 程序、握手、文件读取与返回内容已经实际执行；没有调用模型。展示路径为教学映射，原路径保留在 raw。\n\n## 3. tools/list 到模型工具定义\n\n`codex-mcp/src/rmcp_client.rs:668-695,1026-1036` 在初始化后获取工具列表，支持翻页。普通 Server 的工具信息在 `844-866` 使用配置名称作为 callable namespace，保留原始 `tool.name` 用于调用。Server 提供的 instructions 可作为 namespace description；本例没有 instructions，所以 description 是空字符串。\n\n`enabled_tools=[\"read_text_file\"]` 由 `codex-mcp/src/tools.rs:71-105` 按原始工具名称筛选。本例 Server 返回 14 个工具，但只注册本例读工具。它不关闭其他 Codex 内置工具，不能说模型在产品中只剩这一只工具。\n\n`core/src/config/mod.rs:1938-1941` 默认保留 `mcp__` 前缀；`codex-mcp/src/tools.rs:115-233` 规范化模型侧名字并保留路由信息。于是：\n\n- 配置 Server 名：`course_files`。\n- MCP 原始工具名：`read_text_file`。\n- 模型侧 namespace：`mcp__course_files`；函数名仍为 `read_text_file`。\n\n该固定版本 `core/src/tools/handlers/mcp.rs:502-533` 构造 `ToolSpec::Namespace`。普通 Responses 请求的 `tools` 中放 namespace 及内部 function；不是一只扁平 function 名 `mcp__course_files__read_text_file`。界面或日志可以显示扁平名称，不等于实际请求字段。\n\n模型支持搜索工具时 MCP 默认延迟暴露；本例设置 `[features.code_mode].direct_only_tool_namespaces=[\"mcp__course_files\"]`，见 `core/src/tools/spec_plan.rs:254-284`，使这个 namespace 直接进入工具定义。`tool_search=false` 已是 removed feature，不能用它解释这个分支。配置形状见 `features/src/feature_configs.rs:38-61` 及 `core/src/config/config_tests.rs:636-650`。\n\n`tools/src/mcp_tool.rs` 与 `tools/src/json_schema.rs` 将 inputSchema 转为模型接受的 schema，必要时补字段或压缩。这个小 schema 无需压缩；`JsonSchema` 类型没有 `$schema` 字段，所以该字段不会原样进入模型 parameters；properties 使用有序映射。原始 title、annotations、outputSchema、execution 不直接照搬到 function 对象。`ResponsesApiTool.strict=false`，见 `tools/src/responses_api.rs:121-133,165-174`。\n\n## 4. 一次模型请求仍有基础上下文\n\n主例使用普通非 Lite、非 incremental tools 的 HTTP Responses 路径；MCP namespace 已直接暴露。`core/src/client.rs:956-1006,1068-1090` 负责组装 input 与顶层 tools。若使用 Lite 或增量请求，工具与请求的表示可能不同，本课不混用这些路径。\n\n本例初始 input 四条：\n\n1. developer：公开的 gpt-5.5 基础指令全文。\n2. developer：权限说明。\n3. user：两个 content 段，AGENTS 项目说明、环境。\n4. user：当前读取请求。\n\n`core/src/context/base_instructions.rs:26-45` 返回 developer role；不自行补造 system role。权限/项目/环境的聚合顺序来自 `core/src/session/world_state.rs:202-288`、`core/src/session/mod.rs:4591-4675` 和 `core/src/context_manager/updates.rs`。基础指令与两份已有 Memory/Skills 课件相同，取自公开固定版本模型目录，不是本轮私有系统指令。AGENTS 文本是教学项目材料；路径统一为 `/workspace/course`。\n\n教学请求完整保留本例基础上下文及本例 MCP 工具，集中省略未使用的内置工具、可选模式/插件/Skill/Memory片段、认证头、内部 item ID 和加密推理内容。教学 UUID 仅用于显示稳定标识。这里讲客户端可核查请求，不能把它称为模型内部 Chat Template、线上 API 日志或全部 Codex 配置的通用样本。\n\n## 5. function_call 到 MCP tools/call\n\n模型响应中的调用条目形状见 `assistant-call.json`：`type=function_call`、`namespace=mcp__course_files`、`name=read_text_file`、`arguments` 是 JSON 字符串、`call_id` 用于配对。它没有 `role=assistant` 字段，也不使用 Chat Completions 的 `tool_calls` 数组。\n\n`core/src/tools/router.rs:257-278` 从 name/namespace 找到注册工具；`core/src/mcp_tool_call.rs:130-169` 解析 arguments，取回原始 Server 名和原始工具名。然后 MCP Client 构造 JSON-RPC `tools/call`，其中 `params.arguments` 是 JSON 对象，见 `rmcp-client/src/rmcp_client.rs:819-897`。模型决定调用的工具和参数；客户端负责查找连接、解析参数、封装协议、发送与接收。`call_id` 与 JSON-RPC `id` 是不同层的配对标识，不说成两者相同或都是模型逐token写出的业务内容。\n\n本例工具 annotations 为 `readOnlyHint=true`，配置 `default_tools_approval_mode=\"writes\"`；`core/src/mcp_tool_call.rs:2466-2478` 在这一配置下不为只读工具请求确认。权限配置允许哪些调用与 MCP 协议格式是不同问题。filesystem 允许目录由 Server 自己校验，不把 Codex shell sandbox 文本说成该 Node Server 的访问控制机制。\n\n## 6. Server 返回与模型输入不同\n\n真实结果同时有：\n\n- `content: [{type:\"text\",text:文件全文}]`\n- `structuredContent: {content:文件全文}`\n\n`protocol/src/models.rs:2414-2448` 在没有加密内容且 structuredContent 非 null 时优先序列化它，得到紧凑 JSON 字符串。`core/src/tools/context.rs:185-215` 再在前面添加 `Wall time: … seconds\\nOutput:`，按输出预算处理。这个短结果未触发截断。源码未把 content 与 structuredContent 各重复粘贴一次。\n\n模型收到的 `function_call_output.output` 因此是含上述标题与 JSON 内容的字符串。success 是内部标记，不另塞一个输出字段。若没有 structuredContent，走 content items 分支，把 text 转为 input_text 数组；不是所有 MCP 工具结果都使用本例这一种形状。\n\n`convert_case.py` 从第二轮真实 raw 的教学路径副本读取结果，重现这两个有限分支，生成 `function-call-output.json`。时间 `0.0017` 秒填自第二轮 recorder 实测 tools/call 往返 `0.001679` 秒，用来展示包装格式，不称为 Codex handler 的实际耗时。`conversion-record.json` 记录这一性质及内容核验。\n\n下一次模型请求保留原四条输入，并追加 function_call 和对应 function_call_output；最终回答再成为 assistant message。完整材料见 `initial-request.json`、`after-tool-request.json`、`complete-message-list.json`。这条链的例示调用与回答是教学拟写，依据实际文件结果组织；没有人为制造模型实测。\n\n## 7. 可用于课堂的直接解释\n\n- “你在电脑上打开终端，运行 Codex。与模型服务通信、保存对话、调用工具的是这个程序。”\n- “MCP Client 是 Codex 里负责与 MCP Server 通信的部分。”\n- “这个 filesystem Server 也运行在这台电脑上；它提供读取文件的功能。”\n- “客户端先拿到工具名称和参数格式，再把它们放进模型请求。”\n- “模型生成读取调用；客户端把它转换成 tools/call，发送给 Server。”\n- “Server 读到文件后返回内容。客户端把结果放入下一次模型输入，模型才据此回答。”\n\n这几句话分别对应有证据的程序操作，不把 Server、客户端与模型合称为‘AI 自动完成’。\n", "source": {"label": "备课核查记录"}}, "source-real-case-run.md": {"title": "源码与来源：real-case-run.md", "text": "# 官方filesystem案例：实测与来源\n\n- 所选包：`@modelcontextprotocol/server-filesystem@1.0.0`。npm发布时间2026-10-11。\n- npm provenance指向`modelcontextprotocol/servers@c003d0d807409b22fa640d1f8e11f38f15755721` / tag `v1.0.0`。\n- 协议：实际initialize提出并收到`2025-06-18`。这是与固定Codex Legacy路径配合的本例选择。\n- 程序：官方server通过stdio运行，与客户端记录器在同一台电脑。MCP Server的名字不代表远程服务器。\n- 文件：课程评分共识的短摘录，不包含私人Memory。\n- 输出：read_text_file返回`content:[{type:\"text\",text:...}]`，同时返回`structuredContent:{content:...}`，本次成功结果没有显式`isError`字段。\n- 工具：14个定义完整归档，read_text_file的path必填，head/tail可选。\n\n## 归档\n\n- `npm-server-filesystem-1.0.0.json`：npm公开元数据。\n- `npm-provenance.json`与`npm-provenance-decoded.json`：公开发布证明及解码payload。\n- `modelcontextprotocol-server-filesystem-1.0.0.tgz`：原npm包，SHA-1和SHA-512均匹配registry。\n- `filesystem-server-package/`：包内原文件，不改代码。\n- `filesystem-server-provenance.json`：源码、许可、完整SHA-256记录。\n- `server-LICENSE`：包tarball不带LICENSE；从发布commit下载的仓库原文。它说明项目处于MIT→Apache-2.0过渡，文档CC-BY-4.0，保存原文而不概括为单一许可。\n\n## 课堂表达\n\n本例有“启动程序”“发送协议消息”“模型生成调用”“读磁盘”四类动作。客户端启动程序、组装请求、发送JSON-RPC；模型生成要调用的工具名和参数；Server接收工具调用并读取本机文件。模型看到的是客户端提供的工具定义和返回内容。\n\n不得把Python记录器的initialize请求改称Codex真实日志。Codex初始化参数、模型工具名映射与结果包装由固定源码审计提供，课堂可以用教学请求衔接，但必须在来源说明区区别。\n", "source": {"label": "备课核查记录"}}, "source-source-manifest.json": {"title": "源码与来源：source-manifest.json", "text": "[\n  {\n    \"path\": \"codex-rs/Cargo.toml\",\n    \"commit\": \"21c16161191ff965031d1ac41fe9046011610743\",\n    \"url\": \"https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/Cargo.toml\",\n    \"sha256\": \"74a42789073622aaf75a7a4fdeb183eda597c6e6984e0b6640045045b798ed37\"\n  },\n  {\n    \"path\": \"codex-rs/rmcp-client/src/protocol_mode.rs\",\n    \"commit\": \"21c16161191ff965031d1ac41fe9046011610743\",\n    \"url\": \"https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/rmcp-client/src/protocol_mode.rs\",\n    \"sha256\": \"c472aa882c4c66a1d5b1459d4836a1ed507e1c9ecbb86b63b22c7444f0b62cd1\"\n  },\n  {\n    \"path\": \"codex-rs/rmcp-client/src/rmcp_client.rs\",\n    \"commit\": \"21c16161191ff965031d1ac41fe9046011610743\",\n    \"url\": \"https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/rmcp-client/src/rmcp_client.rs\",\n    \"sha256\": \"ee576f4e0c40bbbc2814bb8b7bfb247cacec6ba8005466aab86e8ac799b18047\"\n  },\n  {\n    \"path\": \"codex-rs/rmcp-client/src/local_stdio_transport.rs\",\n    \"commit\": \"21c16161191ff965031d1ac41fe9046011610743\",\n    \"url\": \"https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/rmcp-client/src/local_stdio_transport.rs\",\n    \"sha256\": \"671eff30337c4171f8466c33ff096941f03e63648b2f5a374c5c49c9855d80dd\"\n  },\n  {\n    \"path\": \"codex-rs/rmcp-client/src/stdio_server_launcher.rs\",\n    \"commit\": \"21c16161191ff965031d1ac41fe9046011610743\",\n    \"url\": \"https://github.com/openai/codex/blob/21c16161191ff965031d1ac41fe9046011610743/codex-rs/rmcp-client/src/stdio_server_launcher.rs\",\n    \"sha256\": \"4c3e81d4e723ff0be9a760c76b7198b78ef4aafe3e1e2e7895ee60248c73d448\"\n  },\n  {\n    \"path\": \"codex-rs/codex-mcp/src/rmcp_client.rs\",\n    \"commit\": \"21c16161191ff965031d1ac41fe90
